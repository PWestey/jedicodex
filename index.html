<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12161D" />
<title>Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#12161D; --panel:#1A1F28; --panel2:#20262F; --line:#2A313D;
  --parch:#E9E3D5; --parch-dim:#C4BEB0; --muted:#868E9C; --muted2:#5C6473;
  --brass:#C6A24C; --brass-dim:#8C7538; --verdi:#6FA392; --err:#C97A6A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--base);color:var(--parch);font-family:'Inter',system-ui,sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.shell{width:100%;max-width:500px;min-height:100vh;display:flex;flex-direction:column;position:relative;}

.head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--line);}
.word{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.14em;text-transform:uppercase;}
.word .dot{color:var(--brass);}
.streak{display:flex;flex-direction:column;align-items:flex-end;line-height:1;}
.streak .n{font-family:'Fraunces',serif;font-size:22px;color:var(--brass);font-weight:600;}
.streak .l{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

.body{flex:1;overflow-y:auto;padding:22px 22px 100px;}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.h1{font-family:'Fraunces',serif;font-size:26px;font-weight:500;line-height:1.15;margin-bottom:4px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px;}

.stage{perspective:1400px;margin:8px 0 20px;}
.card{position:relative;width:100%;min-height:330px;transition:transform .55s cubic-bezier(.4,.05,.2,1);transform-style:preserve-3d;cursor:pointer;}
.card.flip{transform:rotateY(180deg);}
@media (prefers-reduced-motion:reduce){.card{transition:none;}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);padding:26px 24px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 18px 40px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.03);}
.face.back{transform:rotateY(180deg);border-color:var(--brass-dim);}
.tag-row{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass-dim);border-radius:999px;padding:3px 9px;}
.chip.dom{color:var(--muted);border-color:var(--line);}
.front-txt{font-family:'Fraunces',serif;font-size:24px;line-height:1.3;font-weight:500;margin:auto 0;}
.back-txt{font-family:'Newsreader',serif;font-size:18px;line-height:1.55;}
.flip-hint{margin-top:auto;padding-top:18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);}

.rate{display:flex;gap:12px;margin-top:4px;}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--parch);border-radius:11px;padding:15px 0;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:transform .1s ease,border-color .15s;}
.btn:active{transform:translateY(1px);}
.btn.again{color:var(--parch-dim);}.btn.again:hover{border-color:var(--err);}
.btn.got{border-color:var(--brass-dim);color:var(--brass);}.btn.got:hover{border-color:var(--brass);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.dismiss-row{display:flex;justify-content:center;margin-top:14px;}
.dismiss{background:none;border:none;color:var(--parch-dim);font-family:'Inter',sans-serif;font-size:12.5px;letter-spacing:.02em;cursor:pointer;opacity:.55;transition:opacity .15s,color .15s;padding:6px 10px;}
.dismiss:hover{opacity:1;color:var(--err);}
.dismiss:focus-visible{outline:2px solid var(--err);outline-offset:2px;opacity:1;}

.dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s;}
.dot.on{background:var(--brass);}.dot.now{background:var(--parch);transform:scale(1.25);}

.center{text-align:center;padding:48px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.center .mark{font-family:'Fraunces',serif;font-size:40px;color:var(--brass);line-height:1;}
.center h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin-top:6px;}
.center p{color:var(--muted);font-size:14px;max-width:280px;line-height:1.5;}

.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:var(--parch);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:20px;}
.search::placeholder{color:var(--muted2);}.search:focus{outline:none;border-color:var(--brass-dim);}
.dom-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 4px;cursor:pointer;}
.dom-h.first{margin-top:0;}
.dom-name{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:.02em;}
.dom-count{font-size:11px;color:var(--muted);letter-spacing:.1em;}
.dom-rule{height:1px;background:var(--line);margin:8px 0 12px;}
.item{border-left:2px solid var(--line);padding:11px 0 11px 14px;margin-bottom:2px;cursor:pointer;transition:border-color .15s;}
.item:hover{border-color:var(--brass-dim);}
.item .t{font-family:'Newsreader',serif;font-size:16px;line-height:1.3;}
.item .m{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}

.field{margin-bottom:16px;}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:block;}
.input,.area,.select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--parch);font-family:'Inter',sans-serif;font-size:15px;}
.area{font-family:'Newsreader',serif;font-size:17px;line-height:1.5;min-height:110px;resize:vertical;}
.input:focus,.area:focus,.select:focus{outline:none;border-color:var(--brass-dim);}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;}
.seg button.on{border-color:var(--brass-dim);color:var(--brass);background:var(--panel2);}
.save{width:100%;margin-top:6px;background:var(--brass);color:#1a1206;border:none;border-radius:11px;padding:15px 0;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
.save:active{transform:translateY(1px);}.save:disabled{opacity:.4;cursor:default;}
.danger{width:100%;margin-top:10px;background:transparent;color:var(--err);border:1px solid var(--line);border-radius:11px;padding:13px 0;font-size:14px;cursor:pointer;}

.detail-txt{font-family:'Newsreader',serif;font-size:19px;line-height:1.6;margin:16px 0;}
.back-link{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:'Inter',sans-serif;}
.meta-line{font-size:12px;color:var(--muted);letter-spacing:.05em;margin-top:8px;}

.data-row{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);}
.data-row .label{margin-bottom:12px;}
.data-btns{display:flex;gap:10px;}
.data-btns button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--parch-dim);border-radius:10px;padding:12px 0;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.data-btns button:hover{border-color:var(--brass-dim);}
.data-note{font-size:11px;color:var(--muted2);margin-top:10px;line-height:1.5;}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--panel2);border:1px solid var(--brass-dim);color:var(--brass);padding:11px 20px;border-radius:999px;font-size:13px;z-index:50;box-shadow:0 10px 30px -12px rgba(0,0,0,.8);opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;padding:13px 0 16px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted2);font-family:'Inter',sans-serif;position:relative;}
.tab.on{color:var(--brass);}
.tab svg{width:22px;height:22px;}
.tab .lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--brass);color:#1a1206;font-size:9px;font-weight:600;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="word">Codex<span class="dot">.</span></div>
    <div class="streak"><span class="n" id="streakN">0</span><span class="l">day streak</span></div>
  </header>
  <main class="body" id="body"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ── Config ── */
const DOMAINS = { Home:["Parenting","Marriage","Faith"], Work:["Leadership","Habits & Systems"], Body:["Lifting","Nutrition"], Mind:["Growth","Money"] };
const DOMAIN_OF = {}; Object.entries(DOMAINS).forEach(([d,ts])=>ts.forEach(t=>DOMAIN_OF[t]=d));
const BOX_DAYS = {1:1,2:2,3:4,4:7,5:14,6:30,7:60}; const MAX_BOX=7;
const KEY = "codex:data:v1";

/* ── Date helpers ── */
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const addDays=(iso,n)=>{const[y,m,d]=iso.split("-").map(Number);const dt=new Date(y,m-1,d+n);return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;};
const diffDays=(a,b)=>{const[ay,am,ad]=a.split("-").map(Number);const[by,bm,bd]=b.split("-").map(Number);return Math.round((new Date(ay,am-1,ad)-new Date(by,bm-1,bd))/86400000);};
let _id=0; const nid=()=>`c${Date.now().toString(36)}${(_id++).toString(36)}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── Seed ── */
function seed(){
  const t=todayStr();
  const mkc=(topic,front,back,source)=>({id:nid(),topic,domain:DOMAIN_OF[topic],front,back,box:1,due:t,created:t,source});
  return [
    mkc("Parenting","The discipline flow","Name the behavior \u2192 clear instruction \u2192 one warning \u2192 a related consequence \u2192 reconnect. Reconnect is not optional. It's the step that keeps the relationship intact after the correction.","Whole Parent framework"),
    mkc("Parenting","My triggers","Non-compliance, whining, disrespect. When I feel the heat rise, that's the cue to slow down, not speed up. Regulate myself first, then address the behavior.","Personal + Whole Parent"),
    mkc("Parenting","Why my kids can trigger me like no one else","Two reasons: closeness (they live inside my boundaries) and projection (their behavior replays my own childhood). What I was shamed for as a kid \u2014 backtalk, whining, mess \u2014 is what will heat me up as a dad. If my reaction is bigger than the behavior, it's my history talking.","Jon Fogel \u2014 How to Not Lose Your Sh*t"),
    mkc("Parenting","Never assume attention","Kids' brains can't multitask. Most \"not listening\" is \"never actually heard you.\" Get full attention first \u2014 hand on shoulder, pause the tablet \u2014 then speak. And give the tablet back for a minute after, so my voice doesn't equal the fun ending.","Jon Fogel \u2014 How to Get Your Kid to Listen"),
    mkc("Parenting","Say less","Use the fewest words that carry the point. Every extra sentence dilutes the instruction and invites tune-out. One clear ask beats a lecture every time.","Jon Fogel"),
    mkc("Parenting","Be worth coming back to","You can't out-chase what's more fun than you \u2014 the dog only came back when chasing stopped. Don't yell across the house; make coming to me safe, calm, and worth it. They ignore what's less interesting than what they're doing, so change the draw, not the volume.","Jon Fogel"),
    mkc("Parenting","Redirect to the positive","Say the behavior I want, not the one I don't. \"Feet on the floor,\" not \"stop kicking.\" A brain hears the action either way \u2014 point it at the right one.","Whole Parent group coaching"),
    mkc("Parenting","Praise the pivot","Don't praise generic good behavior \u2014 praise the moment she catches herself mid-frustration and changes course. That's the skill being built. Spotlight self-correction, and you get more of it.","Whole Parent group coaching"),
    mkc("Parenting","Whining works \u2014 that's why they do it","Parents' brains are wired to find the whine sound impossible to ignore; it survives because it's effective. Distinguish attention-whining (teach the ask: normal voice gets the response) from complaining at a struggle (meet with empathy plus confidence, not rescue).","Whole Parent group coaching"),
    mkc("Parenting","Sibling rivalry is a scarcity contest","Rivalry is natural and spikes where resources feel scarce \u2014 attention, who's first, who gets the ketchup. Same kids play great at the park. Reduce the contest (predictable turns, individual attention) instead of refereeing every skirmish.","Whole Parent group coaching"),
    mkc("Parenting","Embracing her anger \u2014 the 5 steps","1) Name and affirm: \"Your anger is safe with me.\" 2) Stay near, even if told to go away. 3) Strong, safe limits: \"You can be angry AND I won't let you hit.\" 4) Reflect and teach later, when calm. 5) Track her triggers so I'm regulated before it starts.","Julie Fragnito \u2014 Embracing Your Child's Anger"),
    mkc("Parenting","Anger prevention is 20 minutes a day","Twenty undistracted minutes in each daughter's world daily, predictable routines, all feelings allowed at home, lots of physical connection and laughter. Anger prevention is mostly presence, done in advance.","Julie Fragnito"),
    mkc("Parenting","Boredom is a feature, not a problem","Don't fix it \u2014 tolerate it. Set clear expectations the day before, then let them whine through the discomfort. Boredom is where creativity, self-trust, and problem-solving grow. Solving it for them teaches them to depend on me for entertainment.","Julie Fragnito \u2014 Handling Boredom"),
    mkc("Parenting","Emilia: the prompt is the threat","Her rejection is anxiety-driven, not sensory. \"It's disgusting\" is a preemptive shutdown \u2014 her nervous system reads the ask, not the food. Zero food pressure at the table: safe food always on her plate, new foods exist nearby without comment, meals stay easy.","Emilia feeding guide"),
    mkc("Parenting","Emilia: don't over-praise a try","When she tries something, react like it's any normal thing: \"Oh yeah? What did you think?\" Over-praising spotlights the act and raises the anxiety next time. New foods: one at a time, snack context first, 10\u201320 quiet appearances before judging.","Emilia feeding guide"),
    mkc("Parenting","Our marriage is their first relationship lesson","Kids absorb how we disagree. Disagree respectfully in the open \u2014 no slammed doors, no silent treatment \u2014 and let them see the apology and resolution too. Never let a child pick a side. And own my own mood: nobody else is responsible for it.","Julie Fragnito \u2014 Partnership Lessons"),
    mkc("Parenting","World-ready kids do real things","Life skills come from real missions \u2014 manage $10 at the grocery store, order at the counter, make eye contact and say thank you. Then reflect together: what did you learn about yourself? Experience plus reflection is the curriculum.","Lauren Magers \u2014 7 Excursions"),
    mkc("Marriage","Megan's love languages","Acts of service and quality time. Small consistent gestures beat rare grand ones. Ask each day: what did I do that she'd actually feel?","Personal"),
    mkc("Marriage","Gentleman habits","The little things I let slide are the things she notices. Consistency is the gift. Earn it daily \u2014 don't coast on the wedding.","Personal"),
    mkc("Marriage","The SEEN method","Before blaming, run the four questions: What am I Scared of? What am I Embarrassed about? What was I Expecting that I never said? What do I Need? Name the fear underneath instead of firing blame outward.","Morgan Burch \u2014 Dare to be SEEN"),
    mkc("Marriage","The truth is in the triggers","We resent people for doing things we don't feel allowed to do ourselves. And we expect others to react the way we would \u2014 but they're not us. When Megan's behavior stings, check whose rule got broken before assuming hers did.","Morgan Burch"),
    mkc("Marriage","Three lines that stop a fight","\"That didn't feel good \u2014 what was your intention?\" \u00b7 \"I'm feeling defensive \u2014 can you share that another way?\" \u00b7 \"When you said that, I thought you meant ___ \u2014 what did you actually mean?\" Each one swaps accusation for curiosity mid-conflict.","Morgan Burch"),
    mkc("Marriage","Understand, don\u2019t rush to forgive","Trying to forgive keeps score; understanding closes the gap. A fast apology is often a way to skip the discomfort and \u201cmove on\u201d \u2014 when I\u2019m the hurt one, get curious about her intention before I demand one. Blame is drinking poison and expecting her to apologize for it. If I feel misunderstood, she probably does too \u2014 mirror first.","Morgan Burch"),
    mkc("Marriage","Keep the simmer going","Connection at 10pm is built at 7am. A 6-second kiss, a 30-second hug, and specific gratitude (\"thank you for packing lunches\") maintain baseline connection all day. Gratitude is the #1 research predictor of marital satisfaction.","Vanessa & Xander Marin"),
    mkc("Marriage","Sex is not a to-do item","91% of parents say intimacy got harder after kids and the #1 blocker is time \u2014 so it slides down the list as a \u201cluxury.\u201d But it isn't another task to deprioritize like a bubble bath: it's quality time, vulnerability, and presence in one act, one of the most efficient forms of connection we have. If I can't prioritize it for us, prioritize it for the marriage the girls are learning from.","Vanessa & Xander Marin"),
    mkc("Marriage","Daily connection rituals","Morning coffee together before the day starts. Phone-free dinner. One thing I admire about her, out loud. A nightly \"clean-up conversation\" to clear small tensions before they compound. Small, daily, non-negotiable.","The Libido Fairy \u2014 17 Rituals"),
    mkc("Marriage","Score the eight areas yearly","Emotional connection, touch, spiritual unity, sexual intimacy, finances, communication, friendship/flirting \u2014 each of us rates every area 1\u201310 alone, then compare. Pick ONE area for the year and set goals together. Don't fix everything; fix the lowest thing.","Ultimate Intimacy \u2014 goal setting"),
    mkc("Marriage","The drift is quiet","Disconnection doesn't arrive as a fight. It arrives as scrolling while she's mid-sentence, and a \"how was your day\" that stopped waiting for the answer. The smallest moments of attention \u2014 or inattention \u2014 compound harder than any argument.","Dr. Tracy D"),
    mkc("Marriage","Guard against porn","It erodes trust through secrecy, desensitizes dopamine so real intimacy satisfies less, sets false expectations, and objectifies. Protecting my eyes is protecting our intimacy \u2014 this is maintenance, not paranoia.","Ultimate Intimacy \u2014 research summary"),
    mkc("Marriage","The same argument means an unmet need","When a fight repeats, it's never about the topic \u2014 the dishes are a costume on a need (feeling valued, heard, chosen). Solve the need and the argument dies; win the topic and it comes back next week.","Lovethinks / Morgan"),
    mkc("Faith","Presence is a practice","Being fully with my family is a choice, not a mood. The phone and the game are the test. Choose them on purpose.","Personal"),
    mkc("Faith","A Rule of Life","A schedule and set of practices that create space to be with Jesus, become like Jesus, and do what Jesus did. The spiritual life doesn't happen in leftover time \u2014 design the rhythm like I design everything else.","Practicing the Way \u2014 Rule of Life"),
    mkc("Faith","Identity before habits","I don't need more information; I need inner formation. Habits flow from who I believe I am. Anything rooted in fear, guilt, or shame is a false identity \u2014 I was created on purpose, for a purpose, and made for more. Live from that.","Brian Pruett \u2014 Elevate Your Life"),
    mkc("Faith","AM and PM rhythms","PM: digest (no food an hour before bed), rest (airplane mode, disconnect), read. AM: water, movement, gratitude. Let go at night; step into thankfulness in the morning. Gratitude is the superpower.","Brian Pruett"),
    mkc("Faith","Spiritual unity with Megan","Worship together, pray for each other's specific needs, keep God and family as the shared priority. Spiritual unity is a marriage area to actively score and grow \u2014 not a private track we each run alone.","Ultimate Intimacy \u2014 spiritual unity"),
    mkc("Leadership","Executive visibility","Leaders can't reward what they can't see. Translate my team's work into the outcomes leaders actually care about \u2014 frame it in their language and tie the effort to impact, not activity.","Personal framework"),
    mkc("Leadership","Own the work","When someone tries to redirect ownership of what I built, name it plainly and keep the receipts. Line up my backing before the conversation, not during it.","Personal framework"),
    mkc("Leadership","Talking more isn't leading","The Babble Hypothesis: people who talk most get read as leaders \u2014 and it derails careers. In the chair, my job is facilitating, not dominating. As the junior voice in a senior room: fewer, sharper contributions. Every meeting is a job interview.","Your CEO Mentor \u2014 ep. 409"),
    mkc("Leadership","Stop protecting the wrong people","Shielding an underperformer feels kind and demoralizes everyone else: the weakest player smells the fear, the strongest is updating their resume. Protecting one person's comfort at the team's expense is a leadership failure, not compassion.","Your CEO Mentor"),
    mkc("Leadership","Empathy, not sympathy","Feel with them; don't take the problem from them. The line strong leaders never cross: caring about the person becoming carrying their accountability. Support the human, hold the standard.","Your CEO Mentor"),
    mkc("Leadership","Unreasonable hospitality","Give people a level of care that's beyond reasonable \u2014 and treat adversity as the moment to create the story people retell. Problems handled extraordinarily build more loyalty than no problems at all.","Will Guidara via CGLP"),
    mkc("Leadership","The warrior mindset isn't the grind","It's not gritting teeth, hiding weakness, and working until collapse \u2014 that's the version being sold. It's disciplined stewardship of energy, honest self-assessment, and showing up ready. Recovery is part of the fight.","Order of Man"),
    mkc("Leadership","Processes unlock scale","If the operation depends on me personally, I built a job, not a system. Document it, delegate it, and systemize until the team runs well when I'm not in the room. Busy meetings and full calendars can hide total key-person dependency.","Eric Partaker"),
    mkc("Leadership","Get them talking","The small-talk skill isn't having lines to say \u2014 it's questions that get the other person talking about themselves. Curiosity carries every conversation; the person who feels heard remembers you as brilliant.","Cole Jennette \u2014 Small Talk Toolkit"),
    mkc("Leadership","The half-year review","Three questions at midyear: What did the first half teach me? What's working that I should double down on? What should I stop entirely? Look back on purpose before planning forward.","Eric Partaker"),
    mkc("Leadership","The comfort of inaction","The hardest part of every payoff is convincing yourself to start. Introvert, anxious, doesn't matter \u2014 long-term ambitions die in comfortable avoidance, not in failure. Do the uncomfortable thing first.","Your CEO Mentor \u2014 Moment 179"),
    mkc("Habits & Systems","Prompt playbook structure","Every reusable prompt: role, context, task, format, one example. Vague prompts get vague output. Always specify the format you want back.","Personal \u2014 AI Prompt Playbook v2.0"),
    mkc("Habits & Systems","The four laws of habit","Build: make it obvious, attractive, easy, satisfying. Break: make it invisible, unattractive, hard, unsatisfying. Every habit system I design \u2014 mine, my team's, my prompts' adoption \u2014 runs on these four dials.","James Clear \u2014 Atomic Habits cheat sheet"),
    mkc("Habits & Systems","Implementation intentions + stacking","\"I will [behavior] at [time] in [location]\" beats vague intent. And chain new habits to existing ones: \"After [current habit], I will [new habit].\" The trigger does the remembering so willpower doesn't have to.","James Clear"),
    mkc("Habits & Systems","The 2-minute rule + environment design","Scale any new habit down until it takes two minutes to start. Then design the environment so the right choice is the easy one \u2014 visible cues for good habits, friction for bad. The room beats the resolution.","James Clear"),
    mkc("Habits & Systems","One battle at a time","Don't fix your whole life at once \u2014 it's almost impossible and it's how people fail. List the destructive habits, then pick ONE and be a sniper about it. Sequential wins compound; parallel fights collapse.","Jason Kalambay \u2014 8-Step Blueprint"),
    mkc("Habits & Systems","Replace, don't resist","You can't white-knuckle a vice all day \u2014 give the urge a replacement job. Then trap yourself: tell two people you respect, put stakes on it (\"if I fail, I pay you $X\"). Make quitting more expensive than continuing.","Jason Kalambay"),
    mkc("Habits & Systems","See the punch coming","Fighters get knocked out by the punch they didn't see. Name every habit that's stealing from the goals \u2014 write the list, feel the cost. Awareness isn't victory, but nobody wins a fight they don't know they're in.","Jason Kalambay"),
    mkc("Habits & Systems","Close the loop monthly","Monthly audit: update all financial numbers, reflect on spending, review last month's goals, set next month's tied to the bigger plan. Systems without a review cadence quietly rot.","Monthly Audit Checklist"),
    mkc("Habits & Systems","The 1-page day","Each morning: today's top priorities, one thing to get excited about, a phrase to repeat under pressure, and who needs me on my A-game today. One page, five minutes, aims the whole day.","High Performance Planner"),
    mkc("Lifting","My training style","High intensity, low volume, 4\u20135x/week. Progressive overload beats novelty. The last hard rep is where the growth lives \u2014 don't leave it in the tank.","Personal"),
    mkc("Lifting","Two hard programming rules","At least two full rest days per week, and never more than two or three training days in a row. Growth happens between sessions \u2014 the recovery structure IS the program, not an interruption to it.","Jeremy Ethier \u2014 BWS programs"),
    mkc("Lifting","How heavy: 2 honest reps in reserve","End working sets where you could TRULY do only 2 more reps. Could do 3+? Too light \u2014 add weight. Can't hit the bottom of the rep range? Too heavy. Then beat last cycle's weight when the split repeats.","Rogan Cheng / BWS"),
    mkc("Lifting","Double progression","Work up to the top of the rep range (e.g., 3\u00d715) with clean form, then add a little weight and climb again. Slow and gradual on purpose \u2014 big jumps buy an early plateau and injury risk.","Jeremy Ethier \u2014 abs guide"),
    mkc("Lifting","Not all exercises are equal","Some movements are great for almost everyone, some are a waste of time. Pick the best exercise per muscle: stable, easy to load progressively, full stretch under tension. Ruthlessly cut the mediocre ones.","Jeff Nippard \u2014 The Muscle Ladder"),
    mkc("Lifting","The warm-up template","Optional 5 minutes light cardio (especially after a desk day), then 5 minutes dynamic stretching for the half of the body being trained \u2014 arm circles, band pull-aparts, external rotations up top; leg swings below.","Jeremy Ethier \u2014 BWS"),
    mkc("Lifting","The daily mobility five","Cat cow (60s), world's greatest stretch (30s/side), Asian squat (30s hold + 30s rocking), half-kneeling thoracic rotations (30s), wall slides (60s). Five minutes daily unlocks lifts and undoes the desk.","Jeremy Ethier \u2014 mobility routine"),
    mkc("Lifting","Tendon pain: rest makes it worse","Tendons adapt to load; total rest deconditions them and the pain returns worse. Reduce the load and modify the movement \u2014 don't remove loading entirely. Manage it, don't hide from it.","Built With Science"),
    mkc("Lifting","Supplements that earn a spot","Creatine monohydrate, protein powder, fish oil, a multivitamin. That's the science-backed list. Everything else is marketing until training, sleep, and diet are already dialed.","Real Science supplement plan"),
    mkc("Lifting","The dad-training reality","I don't have hours anymore \u2014 and I don't need them. The plan I'll actually repeat every week beats the optimal plan I'll skip. Consistency with a good program outruns perfection with an abandoned one.","Epic Dad Fit"),
    mkc("Nutrition","Protein first","Hit protein before anything else. It anchors satiety and protects muscle in a cut. Track it \u2014 don't estimate it.","Personal"),
    mkc("Nutrition","Name the phase","Recomp near maintenance (~2,450) builds slowly. Cut cycles (~1,950\u20132,100) strip fat. Pick the phase on purpose. Don't drift between them.","Personal plan"),
    mkc("Nutrition","The simple math","Find maintenance, then +200 for a lean bulk or \u2212500 for a cut. Protein: ~2g per kg (0.8g per lb) of bodyweight. Track daily \u2014 without tracking you're guessing, and guessing drifts.","Lars Meidell / Real Science"),
    mkc("Nutrition","The fast-food playbook","Every chain has >14g-protein, <370-calorie options \u2014 Egg McMuffin is 300 cal / 17g protein. A rough day doesn't have to become a blown day. Know the plays before you're hungry in the drive-thru.","Nicko Dumodaug \u2014 Fast Food Guide"),
    mkc("Nutrition","Fullness per calorie","High-fiber, high-volume, lean-protein foods are the cut's best weapon: legumes, oats, berries, chia and flax, pears, brussels sprouts, sweet potatoes. Eat big, stay in deficit, skip the hunger spiral.","Nicko Dumodaug \u2014 food list"),
    mkc("Nutrition","The travel checklist","Before any trip decide: how am I getting there, how long, is there a kitchen? Pack protein snacks (jerky, bars, powder + shaker). Then on vacation \u2014 plan, relax, and enjoy the food. Stress costs more than a meal off plan.","Jeremy Ethier \u2014 BWS Travel Guide"),
    mkc("Nutrition","5-minute protein snacks","Templates, not recipes: Greek yogurt + fruit, cottage cheese + fruit, blended protein ice cream (frozen fruit + whey + almond milk). Each lands 20g+ protein under ~300 calories. Keep the components stocked.","BWS High-Protein Snack Cookbook"),
    mkc("Nutrition","Meal prep kills 21 decisions","Plan the week, shop once, prep in one block, freeze extras for the air fryer. You make the healthy choice one time instead of twenty-one times. Decision fatigue \u2014 not knowledge \u2014 is what breaks diets.","Zeats \u2014 Meal Prep Guide"),
    mkc("Nutrition","Stock the default","Keep the house loaded with the staples: eggs, chicken, ground beef, salmon, Greek yogurt, rice, oats, sweet potato, spinach, berries, olive oil, nuts. When the kitchen is the environment design, the default meal is on-plan.","Lars Meidell \u2014 Top 20 Foods"),
    mkc("Marriage","Boundaries vs. demands","A boundary controls what I do (\u201cI won\u2019t keep talking when I\u2019m yelled at\u201d); a demand tries to control what she does. Boundaries invite the relationship to grow; demands try to force it into something more comfortable and suffocate it. State mine and hold myself to them \u2014 don\u2019t issue orders for her.","Morgan Burch \u2014 Dare to be SEEN"),
    mkc("Marriage","Blame points to the fear underneath","The bigger my anger and the more aggressive my blame, the deeper the fear or embarrassment I\u2019m protecting. \u201cI just need YOU to change\u201d is the tell. The SEEN method isn\u2019t suppressing the feeling \u2014 it\u2019s how I actually regulate it: name what I\u2019m scared or embarrassed about instead of firing it outward.","Morgan Burch"),
    mkc("Marriage","The Love Account","Each of us carries an invisible account of how loved we feel right now \u2014 the sum of deposits and withdrawals. When it runs low we get reactive, defensive, easily sparked. Three jobs: make more small daily deposits, cut the withdrawals \u2014 the passive remarks (\u201cguess I\u2019ll wash your dish again\u201d), micro-criticisms, and unrepaired arguments that drain it faster than big gestures fill it \u2014 and actually accept her deposits with warmth instead of missing them.","Empowered Couples \u2014 Family Meeting Guide"),
    mkc("Marriage","Check in on three timescales","Weekly: repair anything unresolved, sync the schedule, and ask \u2014 what made you feel most connected this week? what felt hard? what can I do to support you? (listen without fixing, end positive). Quarterly: each rate satisfaction in the core areas so quiet dissatisfaction gets voiced. Yearly: revisit vision, goals, and values. Great teams huddle \u2014 schedule it, don\u2019t wing it.","Empowered Couples + Libido Fairy"),
    mkc("Marriage","67% of couple problems are perpetual","Most recurring issues never fully resolve \u2014 they\u2019re rooted in personality and values, not solvable bugs. The real question isn\u2019t \u201chow do we fix this\u201d but \u201ccan I live with this if it never changes?\u201d Move perpetual problems from combat to dialogue; stop trying to win them.","Couples Playground \u2014 Communication Workbook"),
    mkc("Marriage","Four transitional points a day","Waking up, leaving the house, coming home, going to bed \u2014 these four moments set the emotional tone, and we\u2019re most open to change at transitions. A positive goodbye and a real greeting at the door move the whole day. Small changes at the hinges produce big results.","Couples Playground \u2014 52 Challenges"),
    mkc("Marriage","The simple daily check-in \u2014 5 questions","How was today? How are you feeling right now? One thing you\u2019re grateful for? One small thing that would feel good tomorrow? How can I be a better partner to you tomorrow? Five minutes, scheduled, door closed \u2014 and when she answers, listen and validate, don\u2019t problem-solve.","Vanessa & Xander \u2014 Simple Daily Check-In"),
    mkc("Marriage","Talk about the good stuff first","Most couples only talk about sex when something\u2019s wrong, which makes the whole topic feel like a problem. Reverse it: open with a compliment about attraction, then a positively-rooted question (\u201cwhat\u2019s your favorite memory with me?\u201d), then praise afterward. Build comfort on the good before ever raising a complaint.","Vanessa & Xander \u2014 How to Talk About Sex"),
    mkc("Marriage","Spontaneous vs. responsive desire","Spontaneous drive: mental desire comes first, arousal follows. Responsive drive: arousal comes first, then the desire shows up \u2014 often only once things are already underway. Roughly 75% of men run spontaneous, ~30% of women responsive. Neither is broken; a responsive partner isn\u2019t \u201cnot interested,\u201d she just needs the on-ramp before the wanting arrives.","Vanessa Marin \u2014 Sex Drive Type"),
    mkc("Marriage","Initiation has a style","People initiate and want to be initiated in different ways: Excite Me (build a simmer, tease), Take Care of Me (choreplay, carry the load first), Play With Me (make me laugh, inside jokes), Desire Me (show me you want me), Connect With Me (emotional closeness first), Touch Me (physical first, not verbal). Learn Megan\u2019s, lead with it \u2014 and know mine.","Vanessa & Xander \u2014 Art of Initiation"),
    mkc("Marriage","What she actually wants in bed","Not a performance. Four things: take your time and tease, focus on her pleasure, mix it up (most women don\u2019t orgasm from intercourse alone \u2014 clitoral stimulation matters), and stay connected \u2014 eye contact, laughing, presence. Connection matters more than technique; the more connected she feels, the less the mechanics matter.","Vanessa & Xander \u2014 What Women Want"),
    mkc("Marriage","Whoever has lower desire initiates sometimes","Default scripts leave one person always initiating and the other always gatekeeping \u2014 which quietly builds resentment on both sides. Deliberately let the lower-desire partner initiate in a fun way sometimes. It resets the power balance and takes the pressure off the higher-desire partner to always ask.","Ultimate Intimacy \u2014 challenge"),
    mkc("Marriage","Declutter the home to lower the noise","Simplified spaces are easier to manage, which means more rest and more focus on what matters \u2014 fewer environmental withdrawals on everyone\u2019s nervous system. A calmer home is quietly a marriage and parenting intervention, not just tidiness.","30 Days to a Home That Heals"),

    mkc("Marriage","Repair the rupture, not just the topic","Every couple fights; the ones who last are the ones who repair. After it cools, go back: name my part first without a \u201cbut,\u201d name the impact (\u201cthat left you feeling dismissed\u201d), and reconnect physically before re-litigating facts. The repair attempt matters more than who was right \u2014 it\u2019s the strongest predictor of a marriage that survives.","Gottman \u2014 counselor addition"),
    mkc("Marriage","The Four Horsemen","Watch for the four patterns that predict divorce: criticism (attacking her character, not the behavior), contempt (eye-rolls, sarcasm, superiority \u2014 the single deadliest one), defensiveness (counter-attacking instead of hearing), and stonewalling (shutting down and going silent). Contempt is the one to hunt and kill on sight. The antidote to all four starts with me, not her.","Gottman \u2014 counselor addition"),
    mkc("Marriage","Flooded means stop \u2014 same as the kids","When my heart\u2019s pounding and I\u2019m seeing red, my prefrontal cortex is offline \u2014 the exact amygdala hijack I know from the girls. I literally can\u2019t hear her or think straight past ~100 bpm. Call it: \u201cI need 20 minutes, I\u2019m not leaving, I\u2019m coming back.\u201d Then actually self-soothe (don\u2019t rehearse my case). Come back when regulated. Pushing through flooded only does damage.","Gottman \u2014 counselor addition"),
    mkc("Marriage","Complaint, not criticism","\u201cYou never help\u201d / \u201cyou always\u2026\u201d attacks her character and guarantees defensiveness. Instead: \u201cWhen X happened, I felt Y, and I need Z.\u201d Specific behavior, my feeling, a clear ask \u2014 no \u201calways,\u201d no \u201cnever,\u201d no verdict on who she is. Same content, opposite outcome.","Gottman \u2014 counselor addition"),
    mkc("Marriage","Turn toward the small bids","All day she makes tiny bids for connection \u2014 a comment about her day, a \u201clook at this,\u201d a sigh. Turning toward them (a real response, eye contact) instead of away (grunt, phone, \u201cmhm\u201d) is what quietly builds or drains the account. Masters of marriage catch the bids; the drift is just missed bids stacking up.","Gottman \u2014 counselor addition"),
    mkc("Marriage","The 5-to-1 ratio","In conflict, stable couples run about five positive interactions for every negative one \u2014 and closer to 20-to-1 in ordinary life. One sharp remark needs several warm ones to offset it. I don\u2019t have to be perfect in a fight; I have to keep the ratio positive. Repair, humor, affection, agreement all count.","Gottman \u2014 counselor addition"),
    mkc("Marriage","Assume the most generous story","Once resentment sets in, I read neutral acts as hostile \u2014 she forgot the milk \u201con purpose,\u201d the short reply \u201cmeans something.\u201d That\u2019s negative sentiment override, and it manufactures fights out of nothing. Default to the most generous plausible reading of what she did. Ask before I assume.","Gottman \u2014 counselor addition"),
    mkc("Marriage","Accelerators and brakes","Desire isn\u2019t just a gas pedal \u2014 it\u2019s gas plus brakes. For most women the brakes matter more than the gas: stress, resentment, mental load, feeling unsafe, kids-might-wake, body image. \u201cNot in the mood\u201d usually means a brake is on, not that the gas is broken. The move is rarely more seduction \u2014 it\u2019s finding and lifting the brake.","Nagoski, Come As You Are \u2014 sex-therapist addition"),
    mkc("Marriage","Her mental load is a brake \u2014 so service is foreplay","The invisible labor (planning, remembering, managing the kids) is one of the biggest desire-killers for mothers, and resentment about it is a brake that no amount of romance overrides. Megan\u2019s love language is acts of service for a reason: carrying the load without being asked doesn\u2019t just help \u2014 it removes the single biggest thing standing between her and wanting me.","Nagoski + Perel \u2014 sex-therapist addition"),
    mkc("Marriage","The pursuer\u2013distancer trap","When one of us wants more sex and one wants less, the natural moves make it worse: the pursuer pushes (which adds pressure = a brake), the distancer withdraws (which reads as rejection). The cycle, not either person, is the problem. Break it by taking pressure off and rebuilding no-strings connection \u2014 not by pursuing harder.","sex-therapist addition"),
    mkc("Marriage","Love wants closeness; desire wants space","The paradox of long marriage: love thrives on safety, familiarity, and predictability \u2014 and desire needs mystery, novelty, and a little distance. Total domesticity can quietly extinguish eroticism even in a great partnership. Deliberately create separateness and newness: see her as her own person, not just co-parent and roommate.","Esther Perel \u2014 sex-therapist addition"),
    mkc("Marriage","Affection without an agenda","If every touch is a down payment on sex, the lower-desire partner starts flinching from all touch to avoid the transaction. Give a lot of warmth that goes nowhere on purpose \u2014 hugs, hands, a kiss that isn\u2019t a proposition. Safe, no-strings affection is what makes the pressure come off and desire have room to show up.","sex-therapist addition"),
    mkc("Marriage","Scheduling isn\u2019t unromantic","For responsive desire and busy-parent reality, waiting to both spontaneously feel it is a losing bet. Planning it isn\u2019t clinical \u2014 it creates anticipation (a real accelerator) and guarantees the connection actually happens instead of getting crowded out. Put it on the calendar the way we protect anything that matters.","Nagoski \u2014 sex-therapist addition"),
    mkc("Faith","Covenant, not contract","A contract is conditional and transactional \u2014 I\u2019ll hold up my end if you hold up yours. A covenant is unconditional and permanent \u2014 I\u2019m committed regardless. Marriage is covenant. When I catch myself keeping score or thinking \u201cif she would just\u2026,\u201d that\u2019s contract thinking creeping in. Lead with covenant even when I don\u2019t feel it.","Christian marriage framework"),
    mkc("Faith","Love her sacrificially","Ephesians 5: love her as Christ loved the church \u2014 by laying himself down for her. Headship is servanthood, not authority; it means dying to my own comfort and preference first. The question isn\u2019t \u201cis she meeting my needs\u201d but \u201cam I laying myself down for hers.\u201d Marriage is a place I get discipled, not just a relationship I manage.","Ephesians 5 \u2014 faith addition"),

    mkc("Parenting","Discipline means teach, not punish","The word means to teach. When a consequence doesn’t work, it’s usually rooted in fear — and fear is a terrible long-term teacher. Punishment freezes the behavior in the moment (fight/flight), then it comes right back. I’m not trying to make them sorry; I’m trying to teach the next behavior.","Big Little Feelings"),
    mkc("Parenting","Related + immediate consequences","No dessert tonight for throwing a ball at the park fails twice: a young brain can’t connect an event five hours later, and there’s no logical link between the ball and the cookie. The consequence has to connect to the behavior and land close to it. No connection, no correction.","Big Little Feelings"),
    mkc("Parenting","Tantrum vs. meltdown","A tantrum is behavioral — they still have access to the thinking brain, so hold the boundary calmly and flexibly (“not an option now, we can plan it for later”). A meltdown is the lower brain offline from overwhelm — no teaching gets through. Don’t try to fix it or reason; make it safe, say less, let it pass. Same map as my own flooding.","Courtney English"),
    mkc("Parenting","PREP the transition","Most tantrums are transitions — the toddler brain hates surprise even for things that happen daily. PREP: Plan in advance, Reveal the plan, Explain the details (narrate what’s about to happen), and Put them in charge of one small thing (“blue jacket or purple?”). Warning the brain ahead of time prevents the threat response.","Big Little Feelings"),
    mkc("Parenting","Give positive power with a choice","A lot of defiance is a bid for control. Instead of fighting it, hand over a small, bounded choice: “bed now — monkey or bear?” I make the big decision (that it’s bedtime); she makes the little one. Meets the need for power without surrendering the boundary.","Big Little Feelings"),
    mkc("Parenting","Mediator, not judge","In a sibling fight I don’t need the truth and I don’t rule. Get between them, pause, listen to each side, no pain too small, reflect it back (“you wanted the marker, he grabbed it”), empathy to both, then “any ideas how to fix it?” Being the judge robs them of the skill and makes one kid the winner. Stay neutral — throw water on the fire, not fuel.","Heartstring — Sibling Fight Guide"),
    mkc("Parenting","Strong-willed: the mistakes that backfire","With a strong-willed kid, the usual moves make it worse: hurrying and coercion (the frantic-morning spiral), and lecturing in the heat of anger. She isn’t broken and I’m not failing — strong will needs a different approach: fewer battles, more autonomy inside firm limits, and teaching only after everyone’s calm.","Center of Psych — Strong-Willed"),
    mkc("Parenting","Give the instruction once","Decide the consequence before I speak. Then give one clear, concise instruction in a normal voice — no lecture, no hidden criticism. If she doesn’t respond, I act on the consequence instead of repeating myself. Repeating and re-appealing teaches her that my words are optional until I yell.","Center of Psych — Checklist Bundle"),
    mkc("Parenting","Don’t take the autonomy bait","“I’ll do it myself!” and “you don’t care about me!” are bids for independence and leverage, not real accusations. Don’t argue or withdraw the request. Affirm and hold: “I care about you, and this still needs to happen.” Then feed the autonomy with a choice. Staying unshaken teaches the tactic doesn’t work.","Center of Psych — Reaching Agreements"),
    mkc("Parenting","Address the heart, then reconnect","Behavior is a symptom of what’s going on inside. When I correct, get to the root — was it fear, selfishness, feeling unseen? Then close the loop with real repair: name my part if I had one, forgive, restore. Our faith frame: obedience taught with love, not anger, and the relationship put back together every time.","Rebecca Grant — You Choose Chart"),
    mkc("Parenting","Catch the good with a token economy","For a stretch where I’m only noticing misbehavior, a simple token system flips it: earn a token for the good I catch (respect, starting a chore unprompted, independent play), spend tokens on real rewards. It forces me to hunt for what’s going right instead of only reacting to what’s wrong.","Center of Psych — Reserve of Happiness"),
    mkc("Parenting","The Division of Responsibility","The master rule for feeding: I decide what, when, and where; she decides whether and how much. That’s the whole boundary. When I cross it — pushing bites, negotiating amounts — she pushes back and eats worse. Do my job, trust her to do hers. This is the foundation the rest of feeding sits on.","Ellyn Satter — sDOR"),
    mkc("Parenting","Food play: look → touch → smell → taste","A scared eater can’t jump to tasting. Move through stages: looking at the food, touching it, smelling/getting closer, then licking and tasting. Invite, never force — pressure re-triggers the fear. Any low-pressure interaction counts as exposure. For Emilia this is the on-ramp that meal-table pressure skips.","Better Bites — Food Play Plan"),
    mkc("Parenting","How I talk about food matters more than the plate","The goal isn’t broccoli tonight — it’s an adventurous eater for life. So I don’t pressure, bribe, or praise eating (“good job, two bites!” is still pressure), and I don’t become a short-order cook. Keep meal talk light and off the food. A positive table beats a cleaned plate every time.","Nutrition for Littles"),
    mkc("Parenting","Serve family-style, stay authoritative","Put the food in shared dishes and let her serve herself: “this is what we’re having, you can take as much as you want.” That’s the authoritative lane — high expectations plus high sensitivity, leadership with autonomy. Not authoritarian (clean your plate) and not permissive (what do you want instead?).","Family Style — Jennifer Harris RDN"),
    mkc("Parenting","Structure the eating windows","Grazing all day means never hungry enough for a real meal. Set 3 meals + 1–3 snacks at roughly the same times, water only in between. Predictable hunger and predictable structure cut the mealtime battles more than anything on the plate does.","Ellyn Satter / Nutrition for Littles"),
    mkc("Parenting","Play is the work of childhood","Play is her language — it’s how she processes worries, learns, and feels connected to me. Commit to ~10 minutes of real play a day (all at once or in micro-moments). And when I need cooperation, reach for play first: make the shoe “talk,” sing it, turn it into a challenge. It’s hard for a kid to refuse an invitation to play.","Heartstring — Parenting Playbook"),
    mkc("Parenting","Independent play is a skill I build","It’s not automatic — I build it. Declutter and rotate toys, set up a safe yes-space, then start small and stay close, and crucially don’t interrupt or direct when she’s absorbed. Every time I narrate or “improve” her play, I interrupt the muscle she’s growing. My job is presence, not participation.","Andrea Brambila — 10 Days to Independent Play"),
    mkc("Parenting","Less out means more play","Rotate toys — keep 6–10 out, store the rest, swap every 1–4 weeks. Too many options overwhelm a kid the same way they overwhelm me, and an overwhelmed kid bounces instead of playing deep. Fewer, fresher toys = longer, richer independent play. Costs nothing but a bin.","Andrea Brambila — Toy Rotation"),
    mkc("Parenting","Low-stim beats high-stim screens","Fast cuts, flashing color, and loud effects overload a developing nervous system — it’s like trying to focus in a room with strobe lights. Low-stim shows (slower pace, calm narration) leave her more regulated afterward. If there’s screen time, the content matters as much as the clock. AAP: about an hour a day at her age.","Cara / Kaytie Milliken — Screen guides"),
    mkc("Parenting","Connection play — and skip the tickling","Laughter releases oxytocin and resets a rough day. Physical games where I’m the one “losing” or bumbling (taco-roll, knee-bounce, shake-out-the-sillies) empower her while connecting us. Avoid tickling as the tool — it takes away her control even when she’s laughing. I want laughter plus power, not laughter plus helplessness.","Heartstring / Nurtured First"),
    mkc("Parenting","“Doing life” beats kid-centric activities","Kid-centric outings (splash pad, sensory bins) often drain me and overstimulate them. What she actually wants is to do life with me — Home Depot, baking, picking up sticks, washing the car. Those fill both our cups instead of just taking from mine. Presence through ordinary tasks, not a produced event.","Present Parent — Doing Life"),
    mkc("Parenting","Kids must be taught to calm","Sending her to her room to “calm down” assumes a skill she doesn’t have yet. Calming is taught, not commanded. Practice breathing as play when she’s already calm — rainbow breaths, snake breaths, blowing bubbles — so the skill exists to reach for later. Design the capability in advance; don’t demand it mid-storm.","HIC — Breathing Exercises"),
    mkc("Parenting","Co-regulation: I lend her my nervous system","A dysregulated kid borrows calm from a regulated adult. So the work is my body first — unclench, slow my breath, say less, model the calm without instructing her to breathe. Her system reads mine and shifts from fight-or-flight toward settle. I can’t talk her down; I can only bring her down with my own steadiness.","Courtney English — Emotional Regulation"),
    mkc("Parenting","Know each kid’s sensory threshold","Every child has a different-size cup per sense. Low threshold = small cup, overwhelmed fast (loud rooms, tags, textures). Seeker = big cup with a hole, always craving input (crashing, spinning). Knowing each daughter’s profile tells me what triggers the dysregulation and what input actually calms her.","Courtney English — Sensory Profiles"),
    mkc("Parenting","Heavy work is calming","The kid who hangs, leans, climbs, and crashes into everything is self-medicating — proprioceptive input (pushing, pulling, carrying, squeezing) organizes and calms the nervous system. So give it on purpose: carry the groceries, push the laundry basket, animal walks, wall pushes, a crash pad. Movement before I need her regulated, not after.","Courtney English — Heavy Work"),
    mkc("Parenting","The bedtime regulation flow","Order the wind-down to actually work with her body: Connection (a little rough-and-tumble or a song) → Movement (rhythmic, predictable — blanket pulls, rocking) → Organizing/Calming (heavy work — bear hugs, kid-sandwich, tug-of-war) → Transition (lights low, books, snuggles, same closing line). Heavy work before bed, not screens.","Courtney English — Bedtime Routine"),
    mkc("Parenting","Reading readiness is developmental, not age","Ready to read isn’t a birthday — it’s building blocks in order: pre-reading skills, letter sounds, phonemic awareness, blending, then reading. Push too early and I manufacture frustration; wait too long and I miss the interest. Watch for the signs (rhyming, pretend-reading, noticing letters), then start.","Montessori by June — Reading Readiness"),
    mkc("Parenting","LEAD her into reading","Four levers: Language (audiobooks, read to her, discuss it — build background knowledge), Engagement (books she actually cares about, so there’s a why), Affirmation (“you’re a reader who’s learning” — belief matters), and Decoding (systematic phonics, books she can actually read, sit beside her). Meaning and motivation, not just sounding out.","LEAD reading framework"),
    mkc("Parenting","Cue cards + chaining for routines","For a routine she resists, make it visual and let her finish it. Put a picture checklist right where she needs it (shoes by the door). Use chaining: I do all the steps but the last one and let her complete it, then hand her the last two, and so on backward until she owns the whole routine. Praise progress, not perfection.","Lauren Cantrell — Cue Cards"),
    mkc("Parenting","Highly sensitive kids: be the safe space","Roughly 15–20% of kids are highly sensitive — Emilia’s anxiety profile fits. The rules flip: never punish the sensitivity, be the safe space instead of the threat, over-communicate and over-prepare her, invite don’t insist, and find the silver lining in the trait. Consequences work less well on these kids than safety and preparation do.","Jon Fogel — Highly Sensitive Kids Workshop"),
    mkc("Parenting","The conditional yes","Instead of a flat no that trips the alarm, give a yes with a condition attached: “yes — as soon as shoes are on,” “yes, after dinner.” Same boundary, but her brain hears yes and the fight drains out of it. And when a question’s been asked and answered, I don’t re-argue it.","Jon Fogel — SMALL Brain Hacks"),
    mkc("Parenting","Hitting has a reason — and a three-part fix","At this age the theory-of-mind wiring isn’t built — she doesn’t fully grasp the other kid’s pain yet, so consequences alone won’t do it. The fix is three parts: gentle-hands redirect in the moment, calm conversations about it later, and actual practice — not just punishment. Teach the skill that’s missing.","Jon Fogel"),
    mkc("Parenting","Obedience is a bad ultimate goal","A kid who obeys any adult instantly and without question isn’t safe — they’re trainable by the wrong people. I don’t want blind compliance; I want cooperation plus a thinking kid who can eventually push back for good reasons. My discipline flow serves the relationship and the skill, not obedience for its own sake.","Jon Fogel"),
    mkc("Parenting","Kids do well if they can","The reframe under everything: misbehavior is usually a lagging skill or an unmet need, not defiance — it’s can’t, not won’t. When she’s melting down or stuck, ask “what skill is missing here?” instead of “how do I make her comply?” Solve for the gap and the behavior follows.","Jon Fogel / Ross Greene"),
    mkc("Parenting","The repair matters more than the rupture","I will lose my cool sometimes. What the girls actually learn from is the repair afterward — me owning it, no “but you…,” naming the impact, reconnecting. A rupture followed by repair builds more security than never rupturing. It also models the accountability I want them to have. Same move I use with Megan.","Jon Fogel — Failure-Relationship Paradox"),

    mkc("Lifting","Tempo: own the eccentric","Lower under control (2–3 seconds), then drive the concentric as fast as clean form allows. The lowering phase is where a lot of the growth stimulus lives — dropping the weight fast throws away free reps. Control down, explode up.","Real Science / Nippard tempo notation"),
    mkc("Lifting","The three levers trade off","Volume, intensity, and frequency are the dials — and pushing one means easing another. I run high intensity and low volume, so my intensity is near-max and my per-session volume stays low on purpose. More of everything isn’t the goal; the right balance I can recover from is. Adding volume means I’d have to back off intensity or frequency.","Geoffrey Schofield — SWEAT!"),
    mkc("Lifting","Stay on a lift long enough to beat it","Swapping exercises every week feels productive but flattens the progression curve — the muscle never gets to adapt to the same movement twice. Pick the movement, then live on it for a block and chase the numbers up. Novelty is the enemy of overload.","Jeff Nippard"),
    mkc("Lifting","Take failure selectively","Not every set to the bone. Isolation and machine work can go to true failure safely — that’s where the last-rep stimulus is cheap. Heavy compounds (squat, bench, deadlift) I leave 1–2 in reserve; failure there buys form breakdown and injury, not gains. Match proximity-to-failure to the risk of the lift.","Nippard — LSTF / Real Science"),
    mkc("Lifting","The logbook is the program","Progressive overload isn’t a vibe — it’s a number I have to beat. Write down weight and reps every set, every session, and walk in aiming to top last time on something. If I’m not recording it, I’m not progressing it, I’m just working out.","Real Science — Workout Plan"),
    mkc("Lifting","Stimulus-to-fatigue ratio","Some movements give a lot of muscle stimulus for little systemic fatigue and joint cost; others wreck me for a mediocre return. Running low volume, I can’t afford junk fatigue — every exercise has to earn its spot on stimulus-to-fatigue, not ego. High reward, low wreckage.","Schofield — SWEAT! (risk vs reward)"),
    mkc("Lifting","Mind-muscle connection","Especially on isolation work, feeling the target muscle do the work beats moving the weight any way possible. Slow down, shorten the range if I have to, and actually contract the muscle I’m training. Moving weight isn’t the same as training the muscle.","Jeremy Ethier / Nippard"),
    mkc("Lifting","Hit each muscle about twice a week","For growth, frequency of roughly 2x per muscle per week tends to beat blasting it once — more chances to accumulate quality volume and trigger protein synthesis. My split should have each muscle coming back around every 3–4 days, not once a week.","Schofield — SWEAT! / Nippard"),
    mkc("Lifting","Train the core as an anti-mover too","Abs aren’t just crunches. The rectus flexes (crunches, leg raises), but the transverse and obliques resist movement — planks and Pallof presses train the anti-extension and anti-rotation that actually stabilize my spine under load. And abs progressive-overload like any muscle: add reps, then weight.","Nicko Dumadaug — Core Guide"),
    mkc("Lifting","Sleep is a training variable","Recovery isn’t the absence of training — it’s where the adaptation happens, and sleep is the biggest lever in it. Under-sleeping blunts recovery, strength, and hunger control at the same time. Protecting sleep is protecting my gains, not competing with them. Same fight I already know matters.","CBUM — STNDRD / general"),
    mkc("Lifting","Ramp into the first working set","Before the first heavy compound, pyramid up — something like 50% x for a few, 70% for a couple, 90% for one — to prime the pattern and the nervous system without adding fatigue. These feeder sets aren’t working sets; keep them easy. Warm the movement, don’t tax it.","Real Science / Ethier"),

    mkc("Nutrition","Bulk at the right speed","A lean bulk means gaining about 0.5–0.75 lb per week — fast enough to add muscle, slow enough to keep fat off. Gaining much less means I’m leaving muscle on the table; much more means I’m just getting fat and will pay for it in the next cut. Aim for the slow climb, not the fast one.","Real Science — Nutrition Plan"),
    mkc("Nutrition","Adjust to the scale","Every calorie target is an estimate, including mine. The real program is the weekly trend: if the scale isn’t moving the direction the phase wants, nudge intake ~150 cal and reassess. Set the number, watch the trend, adjust. Don’t marry the starting number.","Real Science — Nutrition Plan"),
    mkc("Nutrition","No magic macro split","Once calories and protein are set, the carb-to-fat ratio is mostly preference — there’s no ratio that magically outperforms another. Stop optimizing the split and hit the two things that matter: total calories for the phase, and the protein floor. Simpler is more sustainable.","Real Science — Nutrition Plan"),
    mkc("Nutrition","80/20, not all-or-nothing","Build 80–90% of intake from whole foods for the fiber and micros; the remaining 10–20% can be whatever I want and it won’t hurt results if calories still fit. This is what makes it survivable long-term and what lets me eat with Megan and the girls without it being a production. Adherence beats purity.","Real Science / Epic Dad Fit"),
    mkc("Nutrition","Spread protein across the day","Muscle protein synthesis responds better to several protein feedings than one big hit — aim for 3+ doses of ~25–40g through the day rather than backloading it all at dinner. Same daily total, better use of it. Anchor each meal with a protein.","Real Science — Nutrition Plan"),
    mkc("Nutrition","Don’t crash dietary fat","Fat isn’t just calories — it’s raw material for testosterone and other hormones. Dropping it too low on an aggressive cut tanks hormones, mood, and recovery. Keep a fat floor even when slashing calories; pull more from carbs than from fat once fat is at a reasonable minimum.","Nicko — Natural Testosterone Guide"),
    mkc("Nutrition","The natural testosterone levers","Protecting T at my age isn’t a supplement — it’s the fundamentals stacked: 7–9 hours of sleep, managed stress (chronic cortisol suppresses it), heavy compound lifting, staying out of high body-fat ranges, and enough healthy fats, zinc, and vitamin D. The same habits I’m already chasing, pointed at hormones.","Nicko — Natural Testosterone Guide"),
    mkc("Nutrition","Steps are a fat-loss lever","Walking is underrated cardio — a solid daily step count burns real calories without eating into lifting recovery the way hard cardio can. On a cut, my step count is a dial I can turn instead of cutting food further. Protect the daily walk; it’s doing more than it looks.","Lars Meidell — Top 20 Foods"),
    mkc("Nutrition","Hunger is manageable, not just endured","On a cut, beyond volume foods, the non-food levers matter: hydrate well, protect sleep (short sleep spikes hunger), use black coffee to blunt appetite, and keep protein high for satiety. Hunger is a signal to manage with tools, not a test of willpower to white-knuckle.","Lars Meidell / Nicko"),
    mkc("Nutrition","Budget alcohol on purpose","Alcohol is empty calories that also blunt recovery and testosterone and quietly loosen every food decision after the second drink. It’s not off-limits, but it isn’t free — decide before I’m out whether it fits the phase, the way I worked out for San Diego. Choose it, don’t default into it.","Nicko — Natural Testosterone Guide"),

    mkc("Leadership","Adversity is a terrible thing to waste","I can’t control what hits the team or me — only how I respond and what I pull from it. Treat every setback as raw material for growth instead of something to just survive. The response is the part I own.","Will Guidara via CGLP"),
    mkc("Leadership","Empower, don’t script","Guidara made his team memorize speeches for a new menu — and the whole experience went stale and got panned. Give people the what and the why, then let them execute in their own voice. Over-controlling the how kills the spark that made them worth hiring.","Will Guidara via CGLP"),
    mkc("Leadership","Control or growth — not both","If every idea has to run through me, I’m the bottleneck and the team stops bringing their best. Let them run ideas that fit our values even when they aren’t how I’d do it. A good idea with full buy-in beats a great idea with minimal buy-in.","Will Guidara via CGLP"),
    mkc("Leadership","Interview like a first date","Drop the interrogation checklist. Look for three things: integrity, a real work ethic, and whether they’ll get along with the people already here. Then let new hires catch the culture behind the scenes before I put them on the front line.","Will Guidara via CGLP"),
    mkc("Leadership","The five rules of feedback","Criticize the behavior, not the person. In private, never in public. Never emotional. Consistently. And always lead with a charitable assumption. One more: tell the team I’m raising the feedback bar before I start — raising it cold blindsides people.","Will Guidara via CGLP"),
    mkc("Leadership","Watch the sunk-cost trap","The more I’ve poured into a project, a hire, or an approach, the harder it is to walk away — even when it’s clearly not working. What it cost to get here is gone either way. Decide on what’s true now, not on what I’ve already sunk into it.","50 Rules for Succeeding in Life"),

    mkc("Habits & Systems","Engineer for flow","McKinsey found people are up to 5x more effective in flow — yet most spend under 5% of work in it. Flow isn’t luck; it’s built from Time, Energy, Mentality, Proficiency, Organization (TEMPO). Protect a real block, kill interruptions, and let one hard thing absorb me fully.","Ben Meer — 75 Productivity Hacks"),
    mkc("Habits & Systems","Manage energy, not just time","A full calendar isn’t the same as a productive one. Time is fixed; energy is the variable I actually control — guard sleep, take real breaks, and put the hardest work where my energy peaks, not just where there’s a free slot. Match the task to the tank.","Ben Meer — 75 Productivity Hacks"),
    mkc("Habits & Systems","Never miss twice","Missing once is an accident; missing twice is the start of a new habit — the wrong one. The rule isn’t perfection, it’s the fast return. Whatever slipped — the workout, the writing, the check-in — the only thing that matters is showing up for the very next rep.","James Clear — Atomic Habits"),
    mkc("Habits & Systems","Own the career review","Once a month, run the career pass: list my top 3–5 wins, save every piece of feedback I got, check last month’s goals against what I actually did, and set 2–3 new ones across role, development, and income. Nobody manages my growth for me — the cadence does.","Monthly Audit Checklist"),

    mkc("Parenting","“She’s only five”","When non-compliance or whining spikes my irritation, the reset is one line: she’s only five. She’s still a child, and acting like one is age-appropriate, not defiance aimed at me. Recalibrating the expectation to her actual developmental age drains most of the charge out of the trigger.","All Pro Dad — 30 Day Challenge"),
    mkc("Parenting","Father with the end in mind","Picture Emilia and Olivia at 25 — the women I hope they become — and parent today with that in view. Then the sobering math: I can actually count the weekends left before they leave home. Presence isn’t infinite. The evening I trade away to a screen is subtracted from a fixed total.","All Pro Dad — 30 Day Challenge"),
    mkc("Faith","The rule is a trellis, not a cage","“Rule” of life sounds like legalism, but the root word meant trellis — the structure that lifts a vine so it bears the most fruit. My rhythms aren’t rules to pass or fail; they’re the support that frees me to abide. If a practice starts constricting instead of freeing, I revise it. Review the whole thing each season.","Practicing the Way — Rule of Life"),
    mkc("Faith","The seven practices","The core disciplines a rule of life is built from: silence & solitude, Scripture, prayer, fasting, simplicity, Sabbath, and community. I don’t need all seven firing at once — pick the one or two this season actually needs and work them into the daily and weekly rhythm.","Practicing the Way — Rule of Life"),
    mkc("Faith","Be the warrior my family needs","Five kinds of men: the Whiner stuck in his past, the Worrier afraid of the future, the Waiter hoping to be rescued, the Wounded suffering in silence — and the Warrior, who fights for his marriage and kids and cares more about legacy and character than his circumstances. Every morning I get to choose which one I’m going to be.","All Pro Dad — How to Be the Man"),
    mkc("Faith","Manhood isn’t the résumé","The pull is to measure myself by title, income, degrees — to prove I’m a man by out-achieving. But manhood isn’t how much I know or earn; it’s how much I grow in wisdom and how I show up for the people I’m responsible for. Character over credentials, every time.","All Pro Dad — How to Be the Man"),

    mkc("Leadership","Don’t shrink in the senior room","I can lead my own team with total confidence and still go quiet the moment I’m in the room with execs — letting the loudest voice win and swallowing the point I came in to make. That costs more than my confidence; worse decisions get made when I don’t take up my space. Ground myself before the high-stakes room and walk in already standing in it.","Revive & Thrive — managing up"),
    mkc("Leadership","Workhorses get more work, not promoted","Being the most dependable person — the one who catches every dropped ball and works the weekend — can quietly trap me. I become indispensable to the team I’m in, so no one dares move me. Leaders who rise build the people and systems that run without them, and look up and out to become a trusted advisor to their boss. Promotion comes from proving my team succeeds when I’m not in the room.","Your CEO Mentor"),
    mkc("Leadership","Peer influence is earned, not charmed","Getting peers who don’t report to me to actually listen isn’t about charm, and my title means nothing to them. Influence across the org is earned — through credibility, following through, and being useful to them before I need anything. Bank the trust long before I need to spend it.","Your CEO Mentor"),
    mkc("Leadership","Lead in the grey","Real leadership calls rarely come in black and white — they’re a thousand shades of grey with no clean right answer. Waiting for certainty before I act is itself a decision, and usually a bad one. Make the best call I can with what I have, communicate the why, and adjust as it gets clearer.","Your CEO Mentor"),

    mkc("Growth","The Frog Pond Effect","I judge myself by relative position — how I stack up against the people right around me — not by any absolute standard. My scoreboard is relative, not absolute. That’s why growth feels like destruction: to grow I have to leave the small pond where I’m a big frog for a bigger one where I’m the dumbest in the room. That ego hit isn’t failure — it’s the cost of entry. Pay it with pride.","Sahil Bloom — Curiosity Chronicle"),
    mkc("Growth","The dichotomy of control","The core Stoic move: split everything into what’s up to me and what isn’t. My effort, my choices, my response — mine. Outcomes, other people, the past, what they think — not mine. Peace and power both come from pouring energy only into the first column and releasing my grip on the second.","Daily Stoic"),
    mkc("Growth","The obstacle is the way","Marcus Aurelius: the impediment to action advances action; what stands in the way becomes the way. The thing blocking me isn’t separate from the path — it IS the path. Every obstacle is raw material for the exact virtue the moment calls for: patience, courage, creativity. Don’t wish it away; work it.","Daily Stoic"),
    mkc("Growth","Excellence is a habit, not an act","Arete — excellence — isn’t something I summon on the big day. It’s the accumulation of how I do the small, boring, unwatched things, over and over. I don’t rise to the occasion; I fall to the level of my habits. Build the habit and the moment takes care of itself.","Daily Stoic"),
    mkc("Growth","Time is the one thing I can’t earn back","The wealthy buy cars, homes, jewels — but no one can buy back an hour. Time is the only truly non-renewable resource I have, and I spend it like it’s infinite. Guard it the way I’d guard the most valuable thing I own, because it is. Who and what I give it to is the realest budget I keep.","Daily Stoic"),
    mkc("Growth","I can decide to change","Seneca said we’re all slaves to something — food, phone, drink, ambition. But the chain isn’t fate. The same will that got captured can be turned. Change doesn’t start with a perfect plan; it starts with the decision, made now, that this is no longer who I am. Awareness plus a decision beats awareness alone.","Daily Stoic"),
    mkc("Growth","Don’t defer the life I want","Memento mori isn’t morbid — it’s a forcing function. “Later” quietly assumes a supply of time I was never promised. The trip, the words to Megan, the thing I keep meaning to try — the honest question is why not now. Let death’s certainty make the living urgent instead of someday.","Daily Stoic"),
    mkc("Growth","I’d probably be no different","It’s easy to judge someone’s cowardice or failure and think I’d have done it right. But put in their exact position — their fear, their pressure, their formation — I’d likely have done the same. That humility does two things: it softens my contempt for others and it kills the excuse that I’m the exception. Judge my own actions first.","Daily Stoic"),
    mkc("Habits & Systems","Keep a decision journal","Before a real decision, write down the call, what I expect to happen, and why — then revisit it later. It separates decision quality from outcome luck (a good process can still get unlucky), kills hindsight bias, and over time shows me my actual patterns. Clearer thinking now, and something I can trust myself against later.","Ben Meer — System Sunday"),

    mkc("Parenting","Why my kids lie","When I catch a lie and start interrogating — “did you lie to me?”, sharper voice, rapid-fire questions — the lesson isn’t honesty, it’s how to hide better next time. Kids mostly lie out of fear of my reaction. So I don’t ask a question I already know the answer to, and I don’t make telling the truth dangerous. Be safe enough that the truth feels possible.","The Considerate Momma"),
    mkc("Parenting","Three sentences when a kid lies","Catch it: “I think something different happened. Can you help me understand?” — open a door, don’t accuse. When fear drove it: “I’m not going to get angry. I just need to know what actually happened.” — remove the threat before asking for truth. After the truth is out: “I can see you were worried about getting in trouble. That makes sense. And I still need honesty from you.” — the acknowledgment and the boundary in one breath.","The Considerate Momma"),
    mkc("Parenting","Never break a promise to them","When Emilia reminds me I promised something — a sleepover, the park — and I’m tired and want to push it off, that’s the moment that matters. To me it’s a small reschedule; to her it’s whether my word means anything at all. Keep the promise, or don’t make it. Their trust in me is built one kept word at a time.","Rising Father"),
    mkc("Parenting","Break the cycle, don’t repeat it","The scary moment is watching my own worst reaction climb out of my kid — or catching myself doing the exact thing I swore I never would. I’m not doomed to repeat how I was parented, but awareness alone doesn’t break the pattern. It takes new skills rehearsed for the hard moments, and repair when I slip. The chain breaks in me.","Peace and Parenting"),
    mkc("Parenting","Watch the quiet one","The loud, melting-down kid gets all my attention. But the “good one,” the easy one, the mature one can be masking it — quietly learning to shrink her needs so she’s never a burden. I don’t mistake compliance for okay. Go looking for what a quiet Emilia or Olivia isn’t saying, and make sure being easy never becomes the price of my attention.","Peace and Parenting"),
    mkc("Parenting","I’m the model they copy","If my kids lack patience or self-control, the honest first place to look is me. They absorb my worst habits faster than any lesson I try to teach — how I handle traffic, my phone, my temper. I can’t lecture my way out of what I model. Self-regulation isn’t separate from parenting; it is parenting.","Rising Father"),
