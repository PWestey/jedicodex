    mkc("Marriage","Stay openable after being hurt","I opened up to Megan once, it came back in the next argument, so a part of me decided: never again, stay surface-level. That quietly costs the whole connection — she can’t know a man who won’t be known. Walking in already expecting it to be used against me is defeat before I speak. Make the pre-decision that if it stings, it won’t drop me. And when I share a struggle, bring the plan too, not just the problem.","High Level Husband"),

    mkc("Marriage","Keep my voice in the hard conversation","When Megan — or anyone — makes a conversation difficult, I don’t have to pick between exploding and going silent. I can stay calm and still hold my position. Someone else being hard to talk to doesn’t mean I lose my voice or turn into someone I’m not. Say it with control, and say it anyway.","Jefferson Fisher"),
    mkc("Parenting","Be willing to be the bad guy","My job isn’t to be liked in the moment — it’s to raise them well. Some of the most loving answers are no, and a limit they need is worth their temporary anger. I don’t apologize for a boundary that’s good for them. Firm and kind aren’t opposites: hold the line, then reconnect.","All Pro Dad"),
    mkc("Growth","Courage doesn’t feel like relief","After I finally say the hard thing, my body keeps replaying it and I feel worse, not lighter. That’s normal — doing the brave thing rarely feels like relief in the moment. The rattled, second-guessing feeling isn’t proof I got it wrong. Don’t undo a good decision just because it didn’t feel good.","Dr. Tracy D."),

    mkc("Growth","Fixed vs growth mindset","A fixed mindset says ability is set, so every challenge is a test I can fail. A growth mindset says ability is built, so challenges are how I get better. Same event, opposite meaning. Catch myself treating a struggle as a verdict on who I am — and treat it as a rep instead.","Mindset — Carol Dweck"),
    mkc("Growth","Praise the effort, not the talent","Telling my girls (or myself) “you’re so smart” makes them protect the label by avoiding risk. Praising the strategy, the effort, the choice to keep going builds kids who take on hard things. Reward the process, not the person.","Mindset — Carol Dweck"),
    mkc("Growth","The power of “not yet”","“I can’t do this” becomes “I can’t do this yet.” One word turns a dead end into a stage in a process. When Emilia hits a wall — or I do — “not yet” keeps the door open and points at the next attempt instead of the failure.","Mindset — Carol Dweck"),
    mkc("Growth","Grit = passion + perseverance","What predicts achievement over the long haul isn’t talent — it’s grit: holding the same top-level goal for years and not quitting when it’s boring or hard. Intensity is easy; the consistency of interest over time is what’s rare and decisive.","Grit — Angela Duckworth"),
    mkc("Growth","Effort counts twice","Talent × effort = skill. Skill × effort = achievement. Effort shows up in both equations — it builds the skill AND turns skill into results. The person grinding usually beats the gifted one who coasts. Bet on effort.","Grit — Angela Duckworth"),
    mkc("Growth","Go deep before chasing new","My all-or-nothing wiring loves starting things. Grit is the opposite muscle: going deeper on one thing for years instead of chasing the next shiny interest. Before starting something new, ask whether I’m building — or just fleeing boredom.","Grit — Angela Duckworth"),
    mkc("Growth","Autonomy, mastery, purpose","For anything past rote work, carrots and sticks backfire. Real motivation runs on three things: autonomy (control over how I work), mastery (getting visibly better), and purpose (it connects to something bigger). Build my work and my team around those, not bribes and threats.","Drive — Daniel Pink"),
    mkc("Growth","If-then rewards can backfire","Dangling a reward for creative work narrows focus and can kill the intrinsic interest that produced the good work. With my team: pay fairly, get money off the table, then drive with meaning and growth — not a bonus for every task.","Drive — Daniel Pink"),
    mkc("Growth","Mastery is an asymptote","You get closer to mastery but never fully arrive — and that’s the point. The joy is in the pursuit, not a finish line. Lifting, leading, faith: fall in love with the practice; the gap that never fully closes is what keeps it alive.","Drive — Daniel Pink"),
    mkc("Growth","Small choices compound","No dramatic moves — just small, smart choices, repeated, multiplied by time. Invisible for a while, then suddenly undeniable. The same math runs against me with small bad choices. Consistency on the little things is the whole game.","The Compound Effect — Darren Hardy"),
    mkc("Growth","100% responsible","I own all of it — my choices, my reactions, my results. No blaming circumstances, my past, or anyone else. It’s a hard pill and a freeing one: if I’m the cause, I’m also the fix. Nothing changes until I take full ownership.","The Compound Effect — Darren Hardy"),
    mkc("Growth","Track it to change it","Whatever I want to improve — spending, calories, time, temper — track it honestly for a week first. The awareness alone shifts behavior, because I can’t fix what I refuse to look at. Measure the thing I’ve been avoiding.","The Compound Effect — Darren Hardy"),
    mkc("Growth","Say “I don’t know”","The three hardest words to say. Faking certainty blocks the question that leads to a real answer. Admitting ignorance is where figuring it out begins — with my team, my kids, my faith. Trade fake confidence for honest curiosity.","Think Like a Freak — Levitt & Dubner"),
    mkc("Growth","Find the real incentive","People don’t do what they say; they do what they’re rewarded for. When behavior confuses me — an employee, a kid, myself — stop moralizing and ask what incentive is actually driving it. Change the incentive and the behavior follows.","Think Like a Freak — Levitt & Dubner"),
    mkc("Growth","Redefine the problem","Most people attack the problem as first stated. Re-ask the question — the real bottleneck usually isn’t where everyone’s looking. Before I solve, make sure I’m solving the right problem.","Think Like a Freak — Levitt & Dubner"),
    mkc("Growth","Introversion is a strength","Our culture worships the bold, fast, talkative “extrovert ideal,” but introverts bring deep focus, real listening, and thinking before speaking — and that’s a third to half of people. Not shyness to fix; a temperament to leverage.","Quiet — Susan Cain"),
    mkc("Growth","Solitude fuels the best work","Constant collaboration and open rooms can drown the deep thinking that real breakthroughs need. Guard alone-time for focused work — the quiet is where the good stuff gets made. Protect it like a meeting.","Quiet — Susan Cain"),
    mkc("Growth","Recharge in restorative niches","If I run introverted, people-heavy days drain a real battery, and I refill in solitude — not by pushing harder. Build in restorative niches: quiet mornings, a walk alone, a closed door. Manage the energy instead of white-knuckling it.","The Introvert Advantage — Marti Olsen Laney"),
    mkc("Growth","Pain + reflection = progress","Painful experiences are the raw material of growth — but only if I stop and reflect instead of just reacting. Don’t waste a mistake or a hard season; mine it for the principle it’s trying to teach. Reflect, extract, adjust.","Principles — Ray Dalio"),
    mkc("Growth","Be radically open-minded","My worst blind spots are the ones ego hides. Actively seek thoughtful people who disagree, weight their view by how credible they are on that topic, and stress-test my thinking against theirs. The goal is what’s true, not being right.","Principles — Ray Dalio"),
    mkc("Growth","Write down your principles","When I face a decision, I’ve usually faced its “type” before. Capture how I want to handle each type as a written principle, and decisions become repeatable instead of reinvented under pressure. Build my own playbook.","Principles — Ray Dalio"),
    mkc("Growth","Let them, then let me","When people show me who they are or make their choices — let them. I burn enormous energy trying to control what others do and think. “Let them” releases the grip; “let me” points me back to the one thing I control: my own response.","The Let Them Theory — Mel Robbins"),
    mkc("Growth","Their opinion isn’t my burden","What other people think of me is mostly none of my business, and chasing approval hands them the wheel. Let them think what they’ll think; I steer by my values and the handful of people who actually matter.","The Let Them Theory — Mel Robbins"),
    mkc("Habits & Systems","The habit loop","Every habit runs a loop: cue → routine → reward, with a craving powering it. Habits aren’t willpower failures; they’re grooves. To change one, first see the loop I’m actually running — including the reward the bad habit is quietly paying me.","The Power of Habit — Charles Duhigg"),
    mkc("Habits & Systems","Keep the cue and reward, swap the routine","I can’t erase a habit, but I can redirect it: keep the same cue and same reward, change the routine in between. Bored at night (cue) wanting to unwind (reward) → swap “open a game” for a routine that still pays off.","The Power of Habit — Charles Duhigg"),
    mkc("Habits & Systems","Keystone habits","Some habits quietly pull others into line — exercise, a made bed, a family dinner. Change one keystone habit and a cascade follows. Instead of fixing everything at once, find the one habit that drags the rest upward.","The Power of Habit — Charles Duhigg"),
    mkc("Habits & Systems","Escape narrow framing","“Should I do this — yes or no?” is a trap; a whether-or-not decision means I’ve only found one option. Force a couple more (What else could I do? What would I tell a friend?). Widen the options before I pick.","Decisive — Chip & Dan Heath"),
    mkc("Habits & Systems","Reality-test your assumptions","I gather info that confirms what I already want. Instead, hunt for disconfirming evidence, run a small experiment, or ask someone who’ll tell me I’m wrong. A quick pre-mortem — “it’s a year later and this failed, why?” — surfaces the truth cheaply.","Decisive — Chip & Dan Heath"),
    mkc("Habits & Systems","10/10/10 for distance","Short-term emotion hijacks decisions. Ask: how will I feel about this in 10 minutes, 10 months, and 10 years? The gut-panic usually shrinks at the longer ranges, and the right call gets clearer once I zoom out.","Decisive — Chip & Dan Heath"),

    mkc("Money","Buy assets, not liabilities","The core distinction: an asset puts money in my pocket, a liability takes it out. The rich buy income-producing assets; the middle class buys liabilities they think are assets (the bigger house, the nicer car). Every dollar is a little worker — spend it hiring more workers.","Rich Dad Poor Dad — Robert Kiyosaki"),
    mkc("Money","Make money work for me","Working for money is the treadmill; the goal is to own assets that earn whether or not I show up. Financial freedom is when passive income covers my expenses. Build the machine that pays me, so my time stops being the only thing for sale.","Rich Dad Poor Dad — Robert Kiyosaki"),
    mkc("Money","Financial literacy is the real education","It’s not how much I make, it’s how much I keep and how hard it works. Cash flow, assets, taxes, how money actually moves — that knowledge matters more than income. Fear and “playing it safe” keep smart people broke; learn the game and take intelligent risk.","Rich Dad Poor Dad — Robert Kiyosaki"),
    mkc("Money","Automate the money","Willpower fails; systems don’t. Set automatic transfers on payday — to investments, savings, bills — so the right thing happens without a decision. Design the system once and let it run. What’s automated gets done.","I Will Teach You to Be Rich — Ramit Sethi"),
    mkc("Money","Conscious spending","Spend extravagantly on the few things I truly love, and cut costs mercilessly on everything I don’t. Guilt-free spending isn’t the enemy — unexamined spending is. Decide what my money is FOR, then fund that on purpose.","I Will Teach You to Be Rich — Ramit Sethi"),
    mkc("Money","Win the big wins","Agonizing over $3 lattes while ignoring the 5–10 big levers — savings rate, housing, salary, fees — is backwards. Get the handful of big decisions right and the small stuff barely matters. And a “rich life” is personal: define mine instead of copying anyone else’s.","I Will Teach You to Be Rich — Ramit Sethi"),
    mkc("Leadership","The Law of the Lid","My leadership ability is the ceiling on my effectiveness. A team can only rise as high as the leader running it — raise my lid and I raise everything under it. To grow the org’s results, grow the leader first: me.","The 21 Irrefutable Laws — John Maxwell"),
    mkc("Leadership","Leadership is influence","Not title, not position, not the org chart — leadership is influence, nothing more, nothing less. If no one’s following, I’m just taking a walk. Influence is earned through trust and track record, not granted by a badge.","The 21 Irrefutable Laws — John Maxwell"),
    mkc("Leadership","Leadership develops daily","Leaders are made in small daily disciplines, not in a single event or promotion. What I do consistently — reading, reflecting, reps — compounds into capacity. Lead myself well every day and the growth accrues.","The 21 Irrefutable Laws — John Maxwell"),
    mkc("Leadership","Your inner circle sets your ceiling","Those closest to me determine how far I go. Surround myself with people stronger than me in their lanes and my potential multiplies. Guard who’s in the room — they raise me or cap me.","The 21 Irrefutable Laws — John Maxwell"),
    mkc("Leadership","Be a non-anxious presence","The most important thing I bring to a tense room isn’t answers — it’s my own calm. When everyone’s reactive, the leader who stays steady and self-regulated lowers the whole system’s anxiety. Manage my reactivity first; it’s contagious either way.","A Failure of Nerve — Edwin Friedman"),
    mkc("Leadership","Stay differentiated","Lead from my own clear values instead of bending to whoever’s most upset. Staying connected to people WITHOUT absorbing their emotions or caving to pressure is the whole skill. Be my own person while staying in relationship.","A Failure of Nerve — Edwin Friedman"),
    mkc("Leadership","Don’t let the most anxious set the pace","Systems organize around their most reactive, dependent, or demanding member. If I keep adapting to them, I hand them control. Lead toward strength and health, not toward whoever complains loudest.","A Failure of Nerve — Edwin Friedman"),
    mkc("Leadership","Expect sabotage after real change","When I make a genuine change or hold a hard line, pushback isn’t proof I’m wrong — it’s the system trying to pull me back to normal. Staying steady THROUGH the resistance is what makes the change stick. Don’t cave at the sabotage.","A Failure of Nerve — Edwin Friedman"),
    mkc("Leadership","Be proactive: work your circle of influence","Between what happens and how I respond is a gap — and my freedom lives there. Proactive people pour energy into what they can affect; reactive people burn out on what they can’t. Spend myself on the part I control.","The 7 Habits — Stephen Covey"),
    mkc("Leadership","Begin with the end in mind","Start every effort with a clear picture of the destination. Write the ending first — the man, father, and leader I want to have been — and let it steer today’s choices. Make sure the ladder’s against the right wall before I climb fast.","The 7 Habits — Stephen Covey"),
    mkc("Leadership","Put first things first","Important-but-not-urgent work — health, relationships, planning, growth — gets crowded out by urgent noise. Schedule that Quadrant II work first, on purpose, or it never happens. Don’t prioritize my schedule; schedule my priorities.","The 7 Habits — Stephen Covey"),
    mkc("Leadership","Seek first to understand","Most people listen to reply, not to understand. Truly grasp the other person’s view before I push mine — with Megan, the girls, my team. Understanding first lowers defenses and earns me the right to be heard.","The 7 Habits — Stephen Covey"),
    mkc("Leadership","Find your voice, help others find theirs","Beyond effectiveness is greatness: find my voice — where my talent, passion, need, and conscience meet — then inspire the people I lead to find theirs. Leadership is communicating others’ worth so clearly they come to see it in themselves.","The 8th Habit — Stephen Covey"),
    mkc("Leadership","Don’t criticize, condemn, or complain","Criticism puts people on the defensive and rarely changes them — it just breeds resentment. Any fool can condemn; it takes character to understand and encourage instead. Lead with appreciation, not fault-finding.","How to Win Friends & Influence People — Dale Carnegie"),
    mkc("Leadership","Give honest appreciation","The deepest human craving is to feel important. Sincere, specific appreciation — not flattery — is the cheapest powerful thing I can give. Catch people doing things right and say so, at work and at home.","How to Win Friends & Influence People — Dale Carnegie"),
    mkc("Leadership","See it from their angle","To move anyone, first arouse in them an eager want — talk in terms of what THEY care about, not what I want. Seeing it from the other person’s point of view is the closest thing to a magic formula. Frame my ask in their interests.","How to Win Friends & Influence People — Dale Carnegie"),
    mkc("Leadership","Be genuinely interested in others","I make more friends in two months by being interested in people than in two years trying to make them interested in me. Ask, listen, remember the details. Real curiosity about others is magnetic — and rare.","How to Win Friends & Influence People — Dale Carnegie"),
    mkc("Leadership","Think 10x, not 10%","Incremental goals produce incremental effort. A target an order of magnitude bigger forces a different question — not “how do I work harder” but “what would have to be true?” — and usually a smarter, systemized answer. Let the bigger vision recruit the better strategy.","Ninefigure Mindset — Brandon Dawson"),
    mkc("Habits & Systems","Get it out of your head","My mind is for having ideas, not holding them. Capture every open loop — task, idea, commitment — into one trusted system outside my head, so my brain stops nagging and starts thinking. Open loops drain focus until they’re written down.","Getting Things Done — David Allen"),
    mkc("Habits & Systems","Define the next action","“Plan the trip” stalls; “text Megan possible dates” moves. Every open loop needs a concrete physical next action — the smallest real step. Vague projects don’t get done; next actions do.","Getting Things Done — David Allen"),
    mkc("Habits & Systems","The two-minute rule","If a task takes less than two minutes, do it now rather than tracking it — filing it costs more than doing it. Everything bigger gets deferred into the system or delegated. Small stuff, handled on contact.","Getting Things Done — David Allen"),
    mkc("Habits & Systems","Elimination before efficiency","Being busy is a form of laziness — lazy thinking and indiscriminate action. Doing something well doesn’t make it worth doing. Before I optimize a task, ask whether it should exist at all. Cut first, then streamline what’s left.","The 4-Hour Workweek — Tim Ferriss"),
    mkc("Habits & Systems","Parkinson’s Law","Work expands to fill the time available. Give a task all day and it takes all day; give it two hours and it’s done in two. Set short, almost-uncomfortable deadlines to force focus and cut the fluff. Constrain the time on purpose.","The 4-Hour Workweek — Tim Ferriss"),
    mkc("Habits & Systems","Low-information diet","Most of what I consume — news, feeds, noise — is neither important nor actionable, just anxiety with a refresh button. Ruthlessly cut inputs that don’t serve a decision I’m actually making. Protect attention like the scarce resource it is.","The 4-Hour Workweek — Tim Ferriss"),

    mkc("Leadership","There’s no recipe for the hard things","The easy things have formulas. The genuinely hard things — laying someone off, holding on when it looks hopeless, the call with no good option — have none. The struggle IS the job. Stop waiting for a clean answer that isn’t coming and lead through the mess.","The Hard Thing About Hard Things — Ben Horowitz"),
    mkc("Leadership","People, products, profits — in that order","Take care of the people first; if the people are right, they build the product and the product drives the profit. Reverse the order and it all erodes. How I treat my team isn’t soft — it’s the foundation everything else stands on.","The Hard Thing About Hard Things — Ben Horowitz"),
    mkc("Leadership","Tell it like it is","Trust is built by sharing the bad news, not hiding it. People can handle hard truth; what they can’t handle is being spun or managed. Say the real thing plainly — morale survives honesty far better than it survives a cover-up.","The Hard Thing About Hard Things — Ben Horowitz"),
    mkc("Parenting","Name it to tame it","When a big feeling has flooded Emilia, help her put it into words and tell the story of what happened. Naming the emotion brings the logical brain online to calm the emotional one. I can’t reason a flooded kid down, but I can help her name her way back.","The Whole-Brain Child — Siegel & Bryson"),
    mkc("Parenting","Upstairs and downstairs brain","The “upstairs” thinking brain — self-control, planning, empathy — is under construction until the mid-20s. When my kid melts down, her downstairs reactive brain has taken over. She’s not giving me a hard time; her upstairs brain literally isn’t built yet.","The Whole-Brain Child — Siegel & Bryson"),
    mkc("Parenting","Engage, don’t enrage","In a hot moment I can trigger the reactive downstairs brain with commands and threats, or engage the thinking upstairs brain with a question or a choice. “What’s your plan for this?” beats barking an order — it recruits the part of her I actually want running.","The Whole-Brain Child — Siegel & Bryson"),
    mkc("Parenting","Acknowledge the wish, hold the limit","“No” lands better once the feeling is heard. “You wish you could have ice cream right now — you love it. It’s almost dinner, so it’s a treat tomorrow.” Giving her the wish in words, even in fantasy, softens the limit without moving it.","How to Talk So Little Kids Will Listen — Faber & King"),
    mkc("Parenting","Be playful to get cooperation","Little kids live in play, so a command breeds a battle but a game gets buy-in. Make the toothbrush talk, race to the car, let the shirt “gobble” her arm. Silliness isn’t being a pushover — it’s the shortest path through resistance.","How to Talk So Little Kids Will Listen — Faber & King"),
    mkc("Parenting","Describe the problem, don’t blame","Instead of “Why do you always leave your shoes there?” just describe it: “I see shoes in the doorway.” Stating the problem without the accusation invites her to fix it instead of defend herself. Describe what I see; let her solve it.","How to Talk So Little Kids Will Listen — Faber & King"),
    mkc("Parenting","Don’t accommodate the anxiety","Every time I let Emilia avoid the scary thing or pile on reassurance, the worry gets a little stronger — accommodation feeds it. Love isn’t removing the fear; it’s walking her toward it. Comfort the child, don’t obey the anxiety.","Freeing Your Child from Anxiety — Tamar Chansky"),
    mkc("Parenting","Externalize the worry","Give the worry a name and make it a separate thing — a worry bully, a brain glitch — so it’s Emilia-and-me against the worry, not me against Emilia. “That’s your worry brain talking, not the truth.” Then she can talk back to it instead of believing it.","Freeing Your Child from Anxiety — Tamar Chansky"),
    mkc("Parenting","Climb the fear ladder","Facing a fear all at once overwhelms; facing it in small steps builds proof. Break the scary thing into a ladder and take one rung at a time, each success becoming evidence she can handle the next. Brave is built gradually, not demanded.","Freeing Your Child from Anxiety — Tamar Chansky"),
    mkc("Parenting","Validate the feeling, back her ability","Two things at once: “I know this feels really scary” (I take the feeling seriously) AND “and I know you can handle it” (I believe in her). Not dismissing with “you’re fine,” not rescuing — empathy plus confidence is what grows courage.","Freeing Your Child from Anxiety — Tamar Chansky"),
    mkc("Marriage","Talk about sex outside the bedroom","The worst time to work on our sex life is in the moment, half-clothed and vulnerable. Have low-pressure conversations in normal daylight — what we each like, want, miss. What we can talk about calmly, we can actually change.","Sex Talks — Vanessa Marin"),
    mkc("Marriage","Curiosity, not criticism, in bed","Bring the posture of teammates exploring, not a critic grading. “I’d love to try…” and “what feels good to you?” open doors that complaints slam shut. We’re on the same side of this, figuring it out together.","Sex Talks — Vanessa Marin"),
    mkc("Faith","The gospel in four parts","God, man, Christ, response: God is our holy Creator and King; we’ve all sinned and stand guilty; Jesus lived, died, and rose to take that judgment and give us his righteousness; and the call is to repent and trust him. That’s the frame the whole message hangs on.","What Is the Gospel? — Greg Gilbert"),
    mkc("Faith","The gospel is news, not advice","Most religion is advice — things to do. The gospel is news — something already done. Not “try harder and be good enough,” but “Christ has done it, now believe.” I don’t work to earn it; I rest in what’s finished and let that reshape me.","What Is the Gospel? — Greg Gilbert"),
    mkc("Faith","Don’t neglect the Spirit","I can run the Christian life on my own effort and quietly forget the Holy Spirit is meant to be the power source. A life that actually depends on the Spirit looks different — less white-knuckling, more surrender. Stop striving alone; ask and yield.","Forgotten God — Francis Chan"),
    mkc("Faith","A Spirit-led life takes risk","If my life only makes sense because God is real, I’m leaning on the Spirit. If it runs fine on my own competence and comfort, maybe I’m not. Following him will sometimes look risky and inconvenient — that’s the point, not a malfunction.","Forgotten God — Francis Chan"),
    mkc("Faith","Study with mind and heart","The heart cannot love what the mind does not know. Feelings-first Bible study fizzles; do the work of understanding the text — what it says, what it means — and let real knowledge of God fuel real love for him. Comprehension before application.","God of Deliverance — Jen Wilkin"),
    mkc("Faith","The Bible is about God, not me","I come to Scripture asking “what does this say about me?” when the first question is “what does this reveal about God?” See his character first; my identity and marching orders only come into focus after I’ve seen him clearly.","God of Deliverance — Jen Wilkin"),
    mkc("Faith","Rescued for his presence","Exodus: God doesn’t just free his people FROM slavery, he frees them FOR himself — to dwell among them. Salvation isn’t mainly about my comfort or escape; it’s about being brought near to God. He rescues, then he comes to dwell.","God of Freedom — Jen Wilkin"),
    mkc("Faith","God wins — live with the end in view","Revelation pulls back the curtain: however dark it looks now, God is on the throne and he wins. That certain ending is meant to steady me in today’s trial — worship over worry, faithfulness over fear. Live backward from the victory that’s already sure.","Revelation — Jen Wilkin"),
    mkc("Faith","Read the whole counsel","Don’t just graze the comfortable, familiar passages — read through all of Scripture systematically. The parts I’d skip are usually the ones that stretch me most, and the whole story only makes sense whole. A little every day, cover to cover.","The Bible in 52 Weeks"),

    mkc("Growth","Talk to myself like a friend","When I mess up, my instinct is to lay into myself — but harsh self-criticism triggers shame and shutdown, not change. Talking to myself the way I would a friend I’m rooting for actually produces more follow-through. Kindness isn’t going soft; it’s what keeps me in the game.","Self-Compassion — Kristin Neff"),
    mkc("Growth","A slip isn’t a collapse","My all-or-nothing wiring hears one missed workout or one bad day as “I’ve blown it, may as well quit.” But one data point isn’t the trend — the spiral does far more damage than the slip. Get back on the horse without the self-punishment tax. Missing once is human; quitting is the only real failure.","Self-Compassion — Kristin Neff"),
    mkc("Growth","Rest is part of the work","Recovery isn’t the reward I earn after the work — it’s where the growth actually happens, in muscle and mind alike. My worth isn’t my output. Building in real rest breaks the burnout-then-crash cycle all-or-nothing people fall into. Schedule the rest before I need rescuing by it.","Sacred Rest — Saundra Dalton-Smith"),
    mkc("Faith","Accepted, not auditioning","My standing with God doesn’t rise on a good day or fall on a bad one — grace already settled it. I’m not auditioning for love I have to earn; I’m living from love I already have. For a striver like me, this is the ground to stand on when I inevitably fall short.","Ephesians 2:8–9"),
    mkc("Faith","Sabbath: stop and trust","God built rest into the week and commanded it — one day to stop producing. Sabbath is a weekly declaration that the world holds together without me and that I’m not what I make. Stopping when there’s still more to do is an act of trust, not laziness. Protect a real day off.","Sabbath — Exodus 20:8–11"),
    mkc("Lifting","Train the heart, not just the muscles","My plan is 100% resistance — great for muscle, close to useless for cardiovascular fitness. VO₂max (aerobic capacity) is one of the strongest predictors of how long and how well I live. All the lifting in the world won’t cover this gap. Add dedicated cardio like it matters, because it does.","Outlive — Peter Attia"),
    mkc("Lifting","Zone 2 is the base","Most of my cardio should be easy — conversational pace, ~60–70% max heart rate, 2–3 sessions a week — to build the aerobic engine and recovery. My daily walks count if I push the pace. Then add one harder session a week of intervals to drive VO₂max up. Easy base, occasional peak.","Outlive — Peter Attia"),
    mkc("Lifting","Deload before you break","Every 4–8 weeks, take a lighter week — cut volume, back off intensity — so accumulated fatigue clears and I come back stronger. Planned recovery prevents the forced kind: injury, stalls, burnout. For a hard-charger, the deload is the discipline, not the weakness.","Renaissance Periodization"),
    mkc("Parenting","Faith is caught more than taught","Emilia and Olivia will absorb my actual walk with God — do they see me pray, admit when I’m wrong, worship, lean on him under stress? — far more than any lesson I assign. I can’t hand down a faith I’m only performing. Let them watch the real thing.","Family discipleship"),
    mkc("Parenting","Talk about God in the ordinary","Faith passes in the everyday moments — in the car, at meals, at bedtime — not just in formal sit-downs. Weave him into normal life so knowing God feels woven in, not bolted on. A natural comment beats a lecture every time.","Deuteronomy 6:6–7"),
    mkc("Parenting","Give them room to own it","My job isn’t to manufacture my daughters’ faith — I can’t — it’s to point them to Christ and let it become theirs, not just inherited rule-following. Welcome their hard questions instead of fearing them. Real faith is owned, not forced.","Family discipleship"),
    mkc("Marriage","Pray together","Praying with Megan — even short, even awkward — reaches a deeper intimacy than any date night. Sharing what we’re each carrying before God binds us in a way logistics never will. Lead it gently and don’t wait to feel like it; start small and keep it up.","Spiritual intimacy in marriage"),
    mkc("Marriage","Money is a “we” conversation","Even as the CFP of the house, the point isn’t my competence — it’s that Megan and I face money as teammates. Regular, calm talks about goals, spending, and fears prevent the silent resentment finances breed. Same team, same page, on purpose.","Money & marriage"),
    mkc("Marriage","Dream together","Beyond schedules and to-dos, we need a shared future to point at — what we want for the family in one year, five, ten. Couples drift when the dreaming stops and it’s all logistics. Keep a living picture of the life we’re building together.","Gottman — shared meaning"),
    mkc("Marriage","Keep updating her love map","Knowing Megan’s inner world — her current stresses, hopes, what’s on her mind this week — isn’t a one-time achievement. She changes; keep asking and stay curious so I’m loving the woman she is now, not the one from five years ago. Update the map.","Gottman — love maps"),
    mkc("Growth","Gratitude, on purpose","Naming what I’m thankful for — a few specific things, regularly — measurably lifts mood and starves the comparison and “never enough” machine. It’s not fluff; it’s one of the most evidence-backed habits there is. End the day with three things that went right.","Gratitude research — Robert Emmons"),
    mkc("Growth","Relationships are the whole game","The longest study of human happiness found the number-one predictor of a good life isn’t money, status, or achievement — it’s the quality of close relationships. All my optimizing means little if I neglect Megan, the girls, and real friends. Invest there first.","The Good Life — Harvard Study"),
    mkc("Faith","Prayer: talk to him like he’s there","Prayer isn’t a crisis hotline or a performance — it’s an ongoing, honest conversation. Ask, thank, confess, and actually listen. Keep it constant and real rather than eloquent. The point isn’t good words; it’s a real relationship kept open.","Prayer — Tim Keller"),
    mkc("Faith","Don’t do faith alone","Christianity was never meant to be solo. I need a real community that knows me, spurs me on, and catches me when I drift — not just sermons I consume from a distance. Belong to a church body; be known, not anonymous.","Hebrews 10:24–25"),
    mkc("Habits & Systems","Deep work","The ability to focus without distraction on one demanding thing is rare, valuable, and getting rarer. Batch the shallow stuff — email, pings — kill notifications, and protect long uninterrupted blocks for the work that actually matters. Attention is the asset; guard it.","Deep Work — Cal Newport"),
    mkc("Leadership","Delegate to develop","Handing off real ownership — the outcome and the authority, not just a task list — grows my people and unclogs me at the same time. Doing it myself because it’s faster keeps them small and me buried. Delegate the what and let them own the how.","Multipliers — Liz Wiseman"),
    mkc("Nutrition","Eat for your gut","My protein is dialed, but fiber and plants are the quiet gap — they drive gut health, fullness, and long-term disease protection. Aim for a big volume of vegetables and plenty of fiber daily, with variety across the week. Feed the gut, not just the muscle.","Fiber Fueled — Will Bulsiewicz"),

    mkc("Marriage","Sex isn’t just intercourse","Most of us treat intercourse as the main event, but for most women it isn’t the most pleasurable part — and few reach orgasm from penetration alone. Treat foreplay as equal to intercourse, not a rushed preamble, and keep some clitoral stimulation going during intercourse itself, not only before. Build the whole thing around her pleasure, not just the finish.","Vanessa & Xander Marin"),
    mkc("Marriage","Orgasm is a team goal, not a given","The unspoken script ends things at my finish. Flip it: her orgasm and mine are a shared project we both look out for, and neither is guaranteed or owed. And never make a specific outcome a target to hit — pressure backfires. Aim at connection and pleasure and let the rest follow.","Vanessa & Xander Marin"),
    mkc("Marriage","Her quiet can be a good sign","If Megan goes quiet I read it as “it’s not working” — but many women go inward to focus on sensation, and silence often means the opposite. Instead of guessing, agree on a simple cue ahead of time: a hand squeeze that means “yes, this.” Then I’m not performing in the dark.","Vanessa & Xander Marin"),
    mkc("Marriage","Take the performance pressure off","If I lose my erection mid-moment, that’s an arousal-level thing, not a verdict on me or on us — no emergency. The line that dissolves the pressure for both of us: “Is this feeling good for you? I’m happy to keep going as long as you are.” Curiosity about her beats panic about me.","Vanessa & Xander Marin"),
    mkc("Marriage","Get out of my head, into the moment","Spectatoring — scoring my own performance and her reactions from the outside — kills the very thing I’m anxious about. The fix is to drop back into sensation and my own pleasure. I’m allowed to enjoy this for its own sake, not monitor it. Feel it, don’t grade it.","Vanessa & Xander Marin — Supercharge Your Confidence"),
    mkc("Marriage","Schedule it earlier, build the anticipation","Scheduling sex isn’t unromantic — it protects the time and lets us build anticipation by flirting all day. One tweak: put it earlier in the evening, not right before sleep when we’re both fried and set up to disappoint each other. Plan it for when we’ve still got something in the tank.","Vanessa & Xander Marin — Bring Your Sex Life Back To Life"),
    mkc("Marriage","Give feedback in two choices","“What do you like?” is hard to answer in the moment. Easier: offer a comparison — “this, or this?” — and let her pick, back and forth, dialing it in like Goldilocks. And to redirect without criticizing: “can you do that again, but a little slower?” Works just as well when she says it to me.","Vanessa & Xander Marin"),
    mkc("Marriage","Frame grooming as desire, not criticism","“You need to shower” stings; “I want you — go get cleaned up for me first” lands. Same ask, framed as wanting rather than faulting. Shower together as foreplay, or gift a scent I love. And it runs both ways — my scratchy beard is her comfort too, so the beard oil isn’t just cosmetic.","Vanessa & Xander Marin"),
    mkc("Marriage","Don’t withhold initiation to ‘be respectful’","Hanging back and waiting for Megan to lead can feel considerate, but it dumps all the vulnerability on one of us — and usually leaves neither of us feeling desired. Sharing the risk of reaching for her IS the respect. If we’re both stuck in a standstill, someone just has to go first — even flip a coin.","Vanessa & Xander Marin — The Art of Initiation"),
    mkc("Marriage","Connection-first vs connected-through-sex","Some people need to feel emotionally close before they want sex; others feel close through sex. Megan and I may run opposite ways, and neither is wrong. Naming which each of us is ends a lot of silent frustration — I can give her the connection she needs first, and she can see that sex is partly how I connect.","Vanessa & Xander Marin — Your Best Week Ever"),

    mkc("Parenting","Timeout WITH her, not away from her","Sending a kid off alone to “think about it” registers in her brain close to physical pain, and it buys compliance through a small dose of love-withdrawal — not real understanding. Instead, pause WITH Emilia: stay present, ride it out beside her, lead with “I’ve got you” before any problem-solving. Connection before correction.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Build a calm-down corner","Not a punishment spot — a cozy reset space with a few comforting things she can go to when emotions get big. It gives her somewhere to regulate that isn’t isolation or exile. A place to come back to center, chosen, not a bench she’s sentenced to.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Love that isn’t contingent","If my warmth and attention only show up when she’s behaving or achieving, I’m quietly teaching her that love has conditions. Praise the good, sure — but she should never have to earn my affection. She ought to feel most secure in me exactly when she’s at her worst.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Believe her feelings, stay available","Even when I doubt the facts around it, her emotional report deserves belief — “that sounds really hard” beats “you’re overreacting.” And being available matters more than extracting a talk on my schedule: leave the door open, don’t pry it. She’ll come when she trusts I’ll believe her.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Let her struggle","My instinct is to swoop in the second she’s frustrated, but the struggle itself is where capability gets built. Tolerating a little frustration — the puzzle, the zipper, the hard feeling — grows her more than my rescue does. Stay close and encouraging, but don’t rob her of the win by doing it for her.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Get curious, not furious","When Emilia does something maddening, the move is to investigate it — what’s underneath this? — instead of reacting to the surface. Same lens on my own flash of anger: get curious about what just got triggered in me. Curiosity turns a power struggle into a puzzle I can actually solve.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Discharge my own stress first","A meltdown is immaturity, not an attack on me — but my body doesn’t know that until I tell it. Before I respond, physically shake off the stress (or ground with 5-4-3-2-1) and name my own emotion out loud: “I’m feeling really frustrated right now.” I can’t calm her nervous system with a hijacked one of my own.","Jon Fogel — Whole Parent"),
    mkc("Parenting","No bad feelings — only limits on behavior","Every emotion she has is allowed, even the ugly ones; it’s the behavior that has limits. “You’re allowed to be furious. You’re not allowed to hit.” I don’t need to argue her out of the feeling — I validate the feeling AND hold the line on the action. Both, at once.","Jon Fogel — Whole Parent"),
    mkc("Parenting","Make ‘just breathe’ playful","Telling a flooded kid to “just calm down and breathe” almost never works — it’s too abstract mid-meltdown. Give her something concrete and playful instead: blow out each “candle” finger one at a time, or smell-the-flower then blow-the-pinwheel. Same deep breath, but a version her brain can actually follow.","Jon Fogel — Whole Parent"),

  ];
}

/* ── State + storage ── */
let state={cards:[],meta:{streak:0,last:null},tab:"today"};
let memOnly=false;
// review session
let sess={queue:null,i:0,flip:false,done:0};
// library
let lib={q:"",open:{Home:true,Work:true,Body:true,Mind:true},sel:null,edit:false};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);state.cards=d.cards||[];state.meta=d.meta||{streak:0,last:null};return;}
  }catch(e){memOnly=true;}
  state.cards=seed(); save();
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify({cards:state.cards,meta:state.meta})); }
  catch(e){ memOnly=true; }
}

/* ── Actions ── */
function bumpStreak(){
  const t=todayStr(),m=state.meta;
  if(m.last===t)return;
  if(m.last&&diffDays(t,m.last)===1)state.meta={streak:m.streak+1,last:t};
  else state.meta={streak:1,last:t};
}
function rate(card,got){
  bumpStreak();
  const t=todayStr();
  state.cards=state.cards.map(c=>{
    if(c.id!==card.id)return c;
    const box=got?Math.min(c.box+1,MAX_BOX):1;
    return {...c,box,due:addDays(t,got?BOX_DAYS[box]:1)};
  });
  save();
  sess.flip=false; sess.done++;
  if(!got) sess.queue.push(card.id);
  sess.i++;
  render();
}
function addCard(d){
  const t=todayStr();
  state.cards.unshift({id:nid(),...d,domain:DOMAIN_OF[d.topic],box:1,due:t,created:t});
  save(); toast("Added to the vault");
}
function updateCard(id,patch){
  state.cards=state.cards.map(c=>c.id===id?{...c,...patch,domain:DOMAIN_OF[patch.topic||c.topic]}:c);
  save(); toast("Saved");
}
function deleteCard(id){ state.cards=state.cards.filter(c=>c.id!==id); save(); toast("Removed"); }
function dismissCard(card){
  if(sess.queue)sess.queue=sess.queue.filter(id=>id!==card.id);
  deleteCard(card.id);
  sess.flip=false;
  render();
}

function initSession(){
  const t=todayStr();
  sess.queue=state.cards.filter(c=>diffDays(c.due,t)<=0).sort((a,b)=>a.box-b.box).slice(0,10).map(c=>c.id);
  sess.i=0; sess.flip=false; sess.done=0;
}
function dueCount(){const t=todayStr();return state.cards.filter(c=>diffDays(c.due,t)<=0).length;}
function relDue(due){const d=diffDays(due,todayStr());if(d<=0)return"due now";if(d===1)return"tomorrow";return`in ${d} days`;}
function byId(id){return state.cards.find(c=>c.id===id);}

/* ── Export / Import ── */
function exportData(){
  const blob=new Blob([JSON.stringify({cards:state.cards,meta:state.meta},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`codex-backup-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup downloaded");
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.cards))throw 0;
      if(!confirm(`Replace your current ${state.cards.length} principles with ${d.cards.length} from this file?`))return;
      state.cards=d.cards; state.meta=d.meta||state.meta; save(); render(); toast("Imported");
    }catch(e){ toast("That file couldn't be read"); }
  };
  r.readAsText(file);
}

/* ── Toast ── */
let toastT;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900);
}

/* ── Tab bar ── */
const ICONS={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg>',
  library:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h5v14H4zM10 5h4v14h-4z"/><path d="M15 6l4 1-3 13-4-1"/></svg>',
  add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>'
};
function renderTabs(){
  const due=dueCount();
  const defs=[["today","Today"],["library","Library"],["add","Add"]];
  document.getElementById("tabs").innerHTML=defs.map(([id,lb])=>
    `<button class="tab ${state.tab===id?"on":""}" data-tab="${id}">
      ${id==="today"&&due>0?`<span class="badge">${due}</span>`:""}
      ${ICONS[id]}<span class="lb">${lb}</span>
    </button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
function setTab(t){
  state.tab=t;
  if(t==="today")initSession();
  if(t==="library"){lib.sel=null;lib.edit=false;}
  render();
}

/* ── Views ── */
function render(){
  document.getElementById("streakN").textContent=state.meta.streak;
  renderTabs();
  const body=document.getElementById("body");
  if(state.tab==="today")renderToday(body);
  else if(state.tab==="library")renderLibrary(body);
  else renderAdd(body);
}

function renderToday(body){
  if(sess.queue===null)initSession();
  const total=sess.queue.length;
  if(total===0){
    body.innerHTML=`<div class="center"><div class="mark">◆</div><h3>Caught up</h3>
      <p>Nothing due today. Add a principle, or come back tomorrow and the deck will be waiting.</p></div>`;
    return;
  }
  const card=sess.queue[sess.i]?byId(sess.queue[sess.i]):null;
  if(!card){
    body.innerHTML=`<div class="center"><div class="mark">✦</div><h3>Done for today</h3>
      <p>${sess.done} ${sess.done===1?"card":"cards"} reviewed. Streak intact. That's the five minutes.</p></div>`;
    return;
  }
  const heading=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const dots=sess.queue.map((_,idx)=>`<span class="dot ${idx<sess.i?"on":""} ${idx===sess.i?"now":""}"></span>`).join("");
  body.innerHTML=`
    <div class="eyebrow">${heading}</div>
    <div class="h1">Today's review</div>
    <p class="sub">${total-sess.i} to go · tap the card to reveal</p>
    <div class="dots">${dots}</div>
    <div class="stage">
      <div class="card ${sess.flip?"flip":""}" id="revcard" role="button" tabindex="0">
        <div class="face front">
          <div class="tag-row"><span class="chip dom">${esc(card.domain)}</span><span class="chip">${esc(card.topic)}</span></div>
          <div class="front-txt">${esc(card.front)}</div>
          <div class="flip-hint">Tap to reveal ↺</div>
        </div>
        <div class="face back">
          <div class="tag-row"><span class="chip">${esc(card.topic)}</span></div>
          <div class="back-txt">${esc(card.back)}</div>
        </div>
      </div>
    </div>
    <div class="rate" id="rateRow"></div>`;
  const flipIt=()=>{sess.flip=!sess.flip;render();};
  const cardEl=document.getElementById("revcard");
  cardEl.onclick=flipIt;
  cardEl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipIt();}};
  const row=document.getElementById("rateRow");
  if(sess.flip){
    row.innerHTML=`<button class="btn again" id="bAgain">Again</button><button class="btn got" id="bGot">Got it</button>`;
    document.getElementById("bAgain").onclick=()=>rate(card,false);
    document.getElementById("bGot").onclick=()=>rate(card,true);
    const dz=document.createElement("div");
    dz.className="dismiss-row";
    dz.innerHTML=`<button class="dismiss" id="bDismiss">Not for me — remove this card</button>`;
    row.after(dz);
    document.getElementById("bDismiss").onclick=()=>{
      if(confirm(`Remove this card from your deck?\n\n"${card.front}"\n\nThis can't be undone.`)) dismissCard(card);
    };
  }else{
    row.innerHTML=`<button class="btn" id="bReveal">Reveal</button>`;
    document.getElementById("bReveal").onclick=flipIt;
  }
}

function renderLibrary(body){
  if(lib.sel){const c=byId(lib.sel);if(c){renderDetail(body,c);return;}lib.sel=null;}
  const ql=lib.q.trim().toLowerCase();
  const match=c=>!ql||c.front.toLowerCase().includes(ql)||c.back.toLowerCase().includes(ql)||c.topic.toLowerCase().includes(ql);
  let html=`
    <div class="eyebrow">${state.cards.length} principles</div>
    <div class="h1">Library</div>
    <p class="sub">Everything you've distilled, by domain.</p>
    <input class="search" id="lsearch" placeholder="Search principles…" value="${esc(lib.q)}" />`;
  let first=true;
  Object.keys(DOMAINS).forEach(dom=>{
    const items=state.cards.filter(c=>c.domain===dom&&match(c));
    if(ql&&items.length===0)return;
    html+=`<div class="dom-h ${first?"first":""}" data-dom="${dom}">
        <span class="dom-name">${dom}</span>
        <span class="dom-count">${items.length} · ${lib.open[dom]?"hide":"show"}</span></div>
      <div class="dom-rule"></div>`;
    first=false;
    if(lib.open[dom]){
      html+= items.length ? items.map(c=>
        `<div class="item" data-id="${c.id}"><div class="t">${esc(c.front)}</div>
          <div class="m">${esc(c.topic)} · box ${c.box}</div></div>`).join("")
        : `<p class="sub" style="margin-bottom:8px">No principles here yet.</p>`;
    }
  });
  html+=`<div class="data-row">
      <span class="label">Your data</span>
      <div class="data-btns"><button id="expBtn">Export backup</button><button id="impBtn">Import backup</button></div>
      <p class="data-note">${memOnly
        ? "Heads up: this preview can't save to disk. The downloaded file works fully on your own device."
        : "Saved on this device. Export a backup before switching phones or browsers."}</p>
    </div>`;
  body.innerHTML=html;

  const s=document.getElementById("lsearch");
  s.oninput=e=>{lib.q=e.target.value;renderLibrary(body);
    const ns=document.getElementById("lsearch");ns.focus();ns.setSelectionRange(ns.value.length,ns.value.length);};
  document.querySelectorAll(".dom-h").forEach(h=>h.onclick=()=>{lib.open[h.dataset.dom]=!lib.open[h.dataset.dom];renderLibrary(body);});
  document.querySelectorAll(".item").forEach(it=>it.onclick=()=>{lib.sel=it.dataset.id;lib.edit=false;render();});
  document.getElementById("expBtn").onclick=exportData;
  document.getElementById("impBtn").onclick=()=>document.getElementById("importFile").click();
}

function renderDetail(body,card){
  if(lib.edit){
    body.innerHTML=`
      <button class="back-link" id="cancelEdit">← cancel</button>
      <div class="field"><label class="label">Topic</label>
        <select class="select" id="eTopic">${Object.entries(DOMAINS).map(([d,ts])=>
          `<optgroup label="${d}">${ts.map(t=>`<option value="${t}" ${t===card.topic?"selected":""}>${t}</option>`).join("")}</optgroup>`).join("")}</select></div>
      <div class="field"><label class="label">Cue (front)</label><input class="input" id="eFront" value="${esc(card.front)}" /></div>
      <div class="field"><label class="label">Principle (back)</label><textarea class="area" id="eBack">${esc(card.back)}</textarea></div>
      <button class="save" id="eSave">Save changes</button>`;
    document.getElementById("cancelEdit").onclick=()=>{lib.edit=false;render();};
    document.getElementById("eSave").onclick=()=>{
      const front=document.getElementById("eFront").value.trim();
      const back=document.getElementById("eBack").value.trim();
      const topic=document.getElementById("eTopic").value;
      if(!front||!back)return;
      updateCard(card.id,{front,back,topic}); lib.edit=false; render();
    };
    return;
  }
  body.innerHTML=`
    <button class="back-link" id="toLib">← library</button>
    <div class="tag-row"><span class="chip dom">${esc(card.domain)}</span><span class="chip">${esc(card.topic)}</span></div>
    <div class="h1" style="margin-top:6px">${esc(card.front)}</div>
    <div class="detail-txt">${esc(card.back)}</div>
    <div class="meta-line">Box ${card.box} of ${MAX_BOX} · next review ${relDue(card.due)}</div>
    ${card.source?`<div class="meta-line">Source: ${esc(card.source)}</div>`:""}
    <button class="save" style="margin-top:22px" id="editBtn">Edit</button>
    <button class="danger" id="delBtn">Delete principle</button>`;
  document.getElementById("toLib").onclick=()=>{lib.sel=null;render();};
  document.getElementById("editBtn").onclick=()=>{lib.edit=true;render();};
  document.getElementById("delBtn").onclick=()=>{if(confirm("Delete this principle?")){deleteCard(card.id);lib.sel=null;render();}};
}

let add={dom:"Home",topic:"Parenting",front:"",back:"",source:""};
function renderAdd(body){
  body.innerHTML=`
    <div class="eyebrow">Quick capture</div>
    <div class="h1">Add a principle</div>
    <p class="sub">One idea per card. It enters tomorrow's review automatically.</p>
    <div class="field"><label class="label">Domain</label>
      <div class="seg" id="segDom">${Object.keys(DOMAINS).map(d=>`<button data-d="${d}" class="${add.dom===d?"on":""}">${d}</button>`).join("")}</div></div>
    <div class="field"><label class="label">Topic</label>
      <select class="select" id="aTopic">${DOMAINS[add.dom].map(t=>`<option value="${t}" ${t===add.topic?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label class="label">Cue — the front of the card</label>
      <input class="input" id="aFront" placeholder="e.g. The discipline flow" value="${esc(add.front)}" /></div>
    <div class="field"><label class="label">Principle — what you want to remember</label>
      <textarea class="area" id="aBack" placeholder="The idea, in your own words…">${esc(add.back)}</textarea></div>
    <div class="field"><label class="label">Source <span style="color:var(--muted2)">(optional)</span></label>
      <input class="input" id="aSource" placeholder="Guide, book, or where it came from" value="${esc(add.source)}" /></div>
    <button class="save" id="aSave">Add to the vault</button>`;
  document.querySelectorAll("#segDom button").forEach(b=>b.onclick=()=>{
    add.dom=b.dataset.d; add.topic=DOMAINS[add.dom][0];
    add.front=document.getElementById("aFront").value; add.back=document.getElementById("aBack").value; add.source=document.getElementById("aSource").value;
    renderAdd(body);
  });
  document.getElementById("aTopic").onchange=e=>add.topic=e.target.value;
  const sync=()=>{add.front=document.getElementById("aFront").value;add.back=document.getElementById("aBack").value;add.source=document.getElementById("aSource").value;};
  ["aFront","aBack","aSource"].forEach(id=>document.getElementById(id).oninput=sync);
  document.getElementById("aSave").onclick=()=>{
    sync();
    if(!add.front.trim()||!add.back.trim()){toast("Add a cue and a principle");return;}
    addCard({topic:add.topic,front:add.front.trim(),back:add.back.trim(),source:add.source.trim()});
    add.front="";add.back="";add.source=""; renderAdd(body);
  };
}

/* ── Boot ── */
document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";});
load(); initSession(); render();
</script>
</body>
</html>
